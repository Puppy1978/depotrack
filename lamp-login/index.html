<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamp Login — DepoTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --light: 255, 190, 110;
    --on: 0;
    --lx: 50%; --ly: -20%;
    --text:#eceff5; --muted:#8d93a5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#040506;overflow:hidden}
  body{font-family:Inter,system-ui,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* zona di presa della cordicella (segue il pomello 3D) */
  #grab{
    position:fixed;left:0;top:0;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;
    z-index:5;cursor:grab;touch-action:none;background:transparent;border:0;outline:none;
  }
  #grab:focus-visible{box-shadow:0 0 0 2px rgba(var(--light),.7)}
  #grab:active{cursor:grabbing}
  /* anello pulsante attorno al pomello quando è buio */
  #grab::before,#grab::after{
    content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;
    border:1.5px solid rgba(var(--light),.75);opacity:calc((1 - var(--on)) * .9);pointer-events:none;
    animation:ping 2s ease-out infinite;
  }
  #grab::after{animation-delay:1s}
  @keyframes ping{0%{transform:scale(.6);opacity:calc((1 - var(--on)) * .9)}100%{transform:scale(2.4);opacity:0}}
  #hint{
    position:fixed;left:0;top:0;z-index:4;font-size:12px;color:#7d8394;white-space:nowrap;pointer-events:none;
    opacity:calc(1 - var(--on));transition:opacity .4s;animation:nudge 2.4s ease-in-out infinite;
  }
  @keyframes nudge{0%,100%{translate:0 0}50%{translate:0 5px}}

  /* ---------- FORM ---------- */
  .card{
    position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom));z-index:3;
    width:min(320px, calc(100% - 56px));padding:18px 18px 14px;border-radius:18px;
    transform:translateX(-50%) translateY(calc((1 - var(--on)) * 14px));
    background:
      radial-gradient(120% 90% at var(--lx) var(--ly), rgba(var(--light), calc(var(--on) * .20)), transparent 62%),
      rgba(14,16,22,.62);
    border:1px solid rgba(255,255,255, calc(.04 + var(--on) * .06));
    border-top-color:rgba(var(--light), calc(var(--on) * .35));
    box-shadow:0 30px 80px rgba(0,0,0,.6), inset 0 1px 0 rgba(var(--light), calc(var(--on) * .18));
    backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2);
    opacity:calc(.10 + var(--on) * .90);
    filter:blur(calc((1 - var(--on)) * 3px));
  }
  @media (max-height:620px){ .card{bottom:auto;top:190px} }
  body.dark .card{pointer-events:none}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .logo{width:30px;height:30px;border-radius:8px;overflow:hidden;display:grid;place-items:center}
  h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12px;margin-bottom:12px}
  label{display:block;font-size:11px;font-weight:500;color:var(--muted);margin:0 0 4px 2px}
  .field{position:relative;margin-bottom:9px}
  input{
    width:100%;padding:9px 12px;border-radius:10px;font:inherit;font-size:16px;color:var(--text);
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);outline:none;
    transition:border-color .25s, box-shadow .25s, background .25s;
  }
  input:focus{border-color:rgba(var(--light),.7);background:rgba(var(--light),.05);
    box-shadow:0 0 0 4px rgba(var(--light),.12), 0 0 22px rgba(var(--light),.18)}
  .eye{position:absolute;right:6px;bottom:5px;border:0;background:none;color:var(--muted);
    padding:6px 8px;border-radius:8px;cursor:pointer;font-size:12px}
  .eye:hover{color:var(--text)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:2px 0 12px}
  .row a{color:rgb(var(--light));text-decoration:none}
  .chk{display:flex;align-items:center;gap:6px;cursor:pointer;margin:0}
  .chk input{width:14px;height:14px;accent-color:rgb(var(--light))}
  button.go{
    width:100%;padding:11px;border:0;border-radius:10px;cursor:pointer;
    font:inherit;font-weight:600;font-size:15px;color:#14100a;background:rgb(var(--light));
    box-shadow:0 8px 30px rgba(var(--light),.35);transition:transform .15s, box-shadow .25s, filter .25s;
  }
  button.go:hover{transform:translateY(-1px);box-shadow:0 12px 36px rgba(var(--light),.5)}
  button.go:active{transform:translateY(1px)}
  button.go[disabled]{filter:saturate(.4) brightness(.8);cursor:default}
  .msg{min-height:16px;margin-top:6px;font-size:13px;text-align:center}
  .msg.err{color:#ff8a8a}.msg.ok{color:#8affb4}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}
  .temps{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:8px}
  .temps button{width:17px;height:17px;border-radius:50%;border:2px solid transparent;cursor:pointer;
    background:var(--c);box-shadow:0 0 10px var(--c);transition:transform .2s,border-color .2s}
  .temps button.sel{border-color:#fff;transform:scale(1.15)}
  .foot{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;color:#3a3f4c;z-index:2}

  #motionChip{position:fixed;left:50%;top:max(14px, env(safe-area-inset-top));transform:translateX(-50%);z-index:6;
    font:500 12px Inter,system-ui,sans-serif;color:#e9ecf3;background:rgba(20,22,30,.85);border:1px solid rgba(var(--light),.45);
    padding:8px 14px;border-radius:999px;cursor:pointer;max-width:92vw;transition:opacity .5s}
  #motionChip.ok{border-color:rgba(138,255,180,.5)}
  #motionChip.err{border-color:rgba(255,138,138,.5);color:#ffb3b3}
  #motionChip.hide{opacity:0;pointer-events:none}
  /* fallback senza WebGL */
  body.nogl{background:radial-gradient(ellipse 70% 50% at 50% 30%, rgba(var(--light),.18), #040506 70%)}
  body.nogl #grab, body.nogl #hint{display:none}
</style>
</head>
<body class="dark">
<canvas id="gl"></canvas>
<button id="grab" aria-label="Tira la cordicella per accendere la luce"></button>
<div id="hint">← tira la cordicella</div>
<button id="motionChip" class="hide" type="button"></button>

<form class="card" id="card" novalidate autocomplete="on">
  <div class="brand"><div class="logo"><svg viewBox="0 0 96 96" width="30" height="30" aria-hidden="true"><rect width="96" height="96" rx="10" fill="#2B5C86"/><circle cx="72" cy="24" r="7" fill="#C9821E"/><line x1="18" y1="78" x2="56" y2="40" stroke="#FBFCF8" stroke-width="8" stroke-linecap="round"/><polyline points="18,40 56,40 56,78" fill="none" stroke="#FBFCF8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h1>DepoTrack</h1></div>
  <p class="sub">Accedi al gestionale del deposito</p>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="nome@azienda.it" autocomplete="username" required>
  </div>
  <div class="field">
    <label for="pass">Password</label>
    <input id="pass" type="password" placeholder="••••••••" autocomplete="current-password" required>
    <button type="button" class="eye" id="eye">Mostra</button>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="remember"> Ricordami</label>
    <a href="#" id="forgot">Password dimenticata?</a>
  </div>
  <button class="go" type="submit" id="go">Entra</button>
  <div class="msg" id="msg" aria-live="polite"></div>
  <div class="temps" id="temps" aria-label="Colore luce">
    <button type="button" class="sel" style="--c:rgb(255,190,110)" data-rgb="255, 190, 110" title="Calda" aria-label="Luce calda"></button>
    <button type="button" style="--c:rgb(255,240,220)" data-rgb="255, 240, 220" title="Neutra" aria-label="Luce neutra"></button>
    <button type="button" style="--c:rgb(253,128,46)" data-rgb="253, 128, 46" title="Zucca" aria-label="Luce zucca"></button>
    <button type="button" style="--c:rgb(255,69,0)" data-rgb="255, 69, 0" title="Cremisi" aria-label="Luce cremisi"></button>
    <button type="button" style="--c:rgb(167,139,250)" data-rgb="167, 139, 250" title="Viola" aria-label="Luce viola"></button>
    <button type="button" style="--c:rgb(44,117,255)" data-rgb="44, 117, 255" title="Blu elettrico" aria-label="Luce blu elettrico"></button>
    <button type="button" style="--c:rgb(170,210,255)" data-rgb="170, 210, 255" title="Fredda" aria-label="Luce fredda"></button>
    <button type="button" style="--c:rgb(76,201,240)" data-rgb="76, 201, 240" title="Ciano" aria-label="Luce ciano"></button>
    <button type="button" style="--c:rgb(52,211,153)" data-rgb="52, 211, 153" title="Smeraldo" aria-label="Luce smeraldo"></button>
    <button type="button" style="--c:rgb(196,227,38)" data-rgb="196, 227, 38" title="Lime" aria-label="Luce lime"></button>
  </div>
</form>
<div class="foot">DepoTrack Solutions · demo login</div>

<!-- ================= FORM / UI ================= -->
<script>
(() => {
  const root = document.documentElement, card = document.getElementById('card'), msg = document.getElementById('msg');

  // colore luce
  function applyColor(rgb){
    root.style.setProperty('--light', rgb);
    document.querySelectorAll('#temps button').forEach(x => x.classList.toggle('sel', x.dataset.rgb === rgb));
    window.setLampColor && window.setLampColor(rgb);
  }
  window.__initialLight = '255, 190, 110';
  try{ const s = localStorage.getItem('lampLight3d'); if(s){ window.__initialLight = s; applyColor(s); } }catch(_){}
  document.getElementById('temps').addEventListener('click', e => {
    const b = e.target.closest('button[data-rgb]'); if(!b) return;
    applyColor(b.dataset.rgb); try{ localStorage.setItem('lampLight3d', b.dataset.rgb); }catch(_){}
  });

  document.getElementById('eye').addEventListener('click', () => {
    const p = document.getElementById('pass'), show = p.type === 'password';
    p.type = show ? 'text' : 'password';
    document.getElementById('eye').textContent = show ? 'Nascondi' : 'Mostra';
  });
  document.getElementById('forgot').addEventListener('click', e => {
    e.preventDefault(); say('Nella versione collegata qui parte il reset via email.', '');
  });
  function say(t, cls){ msg.textContent = t; msg.className = 'msg ' + cls; }
  function shake(){ card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake'); }

  /* LOGIN — aggancio Firebase Auth (progetto depotrack-d1d28):
       import { initializeApp } from "firebase-app.js";
       import { getAuth, signInWithEmailAndPassword, setPersistence,
                browserLocalPersistence, browserSessionPersistence } from "firebase-auth.js";
       const auth = getAuth(initializeApp(firebaseConfig));
       window.doLogin = async (email, pass, remember) => {
         await setPersistence(auth, remember ? browserLocalPersistence : browserSessionPersistence);
         return signInWithEmailAndPassword(auth, email, pass);
       };
     Senza aggancio gira la demo: password di almeno 6 caratteri. */
  const demoLogin = (email, pass) => new Promise((res, rej) =>
    setTimeout(() => pass.length >= 6 ? res({ email }) : rej(new Error('auth/wrong-password')), 900));

  card.addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim(), pass = document.getElementById('pass').value;
    if(!/^\S+@\S+\.\S+$/.test(email)){ say('Email non valida.', 'err'); shake(); return; }
    if(!pass){ say('Inserisci la password.', 'err'); shake(); return; }
    const go = document.getElementById('go');
    go.disabled = true; go.textContent = 'Accesso…'; say('', '');
    try{
      await (window.doLogin || demoLogin)(email, pass, document.getElementById('remember').checked);
      say('Accesso riuscito. Benvenuto!', 'ok'); go.textContent = '✓ Dentro';
    }catch(err){
      say('Credenziali errate.', 'err'); shake(); go.disabled = false; go.textContent = 'Entra';
    }
  });

  // fallback se il 3D non parte entro 5 s
  setTimeout(() => {
    if(!window.__glReady){ document.body.classList.add('nogl'); document.body.classList.remove('dark');
      root.style.setProperty('--on', 1); }
  }, 5000);
})();
</script>

<!-- ================= SCENA 3D ================= -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const root = document.documentElement, body = document.body;
const canvas = document.getElementById('gl');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
}catch(e){ throw e; } // il fallback del form scatta da solo

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x030405);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 60);

/* ---------- texture procedurali (intonaco / cemento) ---------- */
function noiseTex(base, spread, blobs, size = 512, srgb = true){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.fillStyle = base; g.fillRect(0,0,size,size);
  for(let k=0;k<blobs;k++){
    const x=Math.random()*size, y=Math.random()*size, r=6+Math.random()*70;
    const l = Math.random()<.5 ? 0 : 255, a = Math.random()*.07;
    const gr = g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${l},${l},${l},${a})`); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x-r,y-r,2*r,2*r);
  }
  const img = g.getImageData(0,0,size,size), d = img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*spread; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  g.putImageData(img,0,0);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
}

/* ---------- stanza ---------- */
const WALL_Z = -1.25, FLOOR_Y = -2.2;
const wallMap = noiseTex('#7d7a74', 22, 320); wallMap.repeat.set(3,2);
const wallBump = noiseTex('#808080', 60, 200, 512, false); wallBump.repeat.set(3,2);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(16, 12),
  new THREE.MeshStandardMaterial({ map:wallMap, bumpMap:wallBump, bumpScale:.025, roughness:.96, metalness:0 }));
wall.position.set(0, 2, WALL_Z); wall.receiveShadow = true; scene.add(wall);
// texture fotografica dell'intonaco (sostituisce quella procedurale appena caricata)
{
  const tl = new THREE.TextureLoader();
  const prep = (t, srgb) => { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.2, 1.65);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy(); if(srgb) t.colorSpace = THREE.SRGBColorSpace; return t; };
  tl.load('wall.jpg', t => { wall.material.map = prep(t, true); wall.material.color.setScalar(.82); wall.material.needsUpdate = true; });
  tl.load('wall_bump.jpg', t => { wall.material.bumpMap = prep(t, false); wall.material.bumpScale = .045; wall.material.needsUpdate = true; });
}

/* ---------- riflessi per i metalli (attivi solo con la luce accesa) ---------- */
const envTex = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
const envMats = [];   // materiali che riflettono l'ambiente, intensità legata alla luce
/* ---------- insegna DepoTrack Solutions in 3D sul muro ---------- */
const LOGO_LIGHT = 20;           // intensità della luce larga che illumina l'insegna
const logo = new THREE.Group(); scene.add(logo);
let logoW = 1, logoH = 1, logoReady = false;
function layoutLogo(){
  if(!logoReady) return;
  // inquadratura di riposo per calcolare dove cade l'insegna tra paralume e card
  camera.position.set(0, baseCamY, baseCamZ); camera.lookAt(0, baseCamY, WALL_Z); camera.updateMatrixWorld();
  const rc = new THREE.Raycaster(), n = new THREE.Vector2(), pl = new THREE.Plane(new THREE.Vector3(0,0,1), -(WALL_Z + .05));
  const toWall = (sx, sy) => { n.set(sx / W * 2 - 1, -(sy / H) * 2 + 1); rc.setFromCamera(n, camera);
    const v = new THREE.Vector3(); rc.ray.intersectPlane(pl, v); return v; };
  const r = document.getElementById('card').getBoundingClientRect();
  const bottomY = toWall(W/2, r.top).y + .05;
  const rim = new THREE.Vector3(0, PIVOT_Y - CABLE - .5, 0).project(camera);
  const topY = toWall(W/2, (1 - rim.y) / 2 * H).y - .24;
  const halfW = Math.abs(toWall(0, H/2).x);
  const k = Math.max(.25, Math.min((topY - bottomY) / logoH, (halfW * 2 * .8) / logoW, .7));
  logo.scale.setScalar(k);
  logo.position.set(0, (topY + bottomY) / 2, WALL_Z + .04);
}
new FontLoader().load('helvetiker_bold.typeface.json', font => {
  const S = 1;                                       // lato dell'icona
  const blue = new THREE.MeshPhysicalMaterial({ color:0x2B5C86, metalness:.1, roughness:.35, clearcoat:1, clearcoatRoughness:.12 });
  const white = new THREE.MeshPhysicalMaterial({ color:0xFBFCF8, metalness:.05, roughness:.35, clearcoat:.8 });
  const amber = new THREE.MeshStandardMaterial({ color:0xC9821E, metalness:.85, roughness:.28 });
  const graphite = new THREE.MeshPhysicalMaterial({ color:0x6b727d, metalness:.5, roughness:.3, clearcoat:.8 });
  [blue, white, amber, graphite].forEach(m => { m.envMap = envTex; m.envMapIntensity = 0; envMats.push(m); });
  const content = new THREE.Group(); logo.add(content);

  // icona: piastra smaltata con freccia in rilievo e pallino in ottone
  const plate = new THREE.Mesh(new RoundedBoxGeometry(S, S, .1, 4, .035), blue);
  plate.position.z = .05; content.add(plate);
  const P = (x, y) => new THREE.Vector3((x/96 - .5) * S, (.5 - y/96) * S, .115);
  const rr = 4/96 * S;
  const stroke = (a, b) => {
    const m = new THREE.Mesh(new THREE.CapsuleGeometry(rr, a.distanceTo(b), 6, 18), white);
    m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), b.clone().sub(a).normalize());
    content.add(m);
  };
  stroke(P(18,78), P(56,40)); stroke(P(18,40), P(56,40)); stroke(P(56,40), P(56,78));
  const dot = new THREE.Mesh(new THREE.CylinderGeometry(7/96*S, 7/96*S, .05, 40), amber);
  dot.rotation.x = Math.PI/2; dot.position.copy(P(72,24)); dot.position.z = .12; content.add(dot);

  // scritta su due righe, lettere scatolate staccate dal muro
  const mk = (txt, mat) => {
    const g = new TextGeometry(txt, { font, size:.36, height:.08, curveSegments:8,
      bevelEnabled:true, bevelThickness:.012, bevelSize:.008, bevelSegments:3 });
    g.computeBoundingBox(); const m = new THREE.Mesh(g, mat); content.add(m); return m;
  };
  const t1 = mk('DEPOTRACK', graphite), t2 = mk('SOLUTIONS', blue);
  const xs = S/2 + .2;
  t1.position.set(xs, .09, 0); t2.position.set(xs, -.09 - .36 * .74, 0);
  const tw = Math.max(t1.geometry.boundingBox.max.x, t2.geometry.boundingBox.max.x);
  logoW = S + .2 + tw; logoH = S;
  content.position.x = -logoW / 2 + S / 2;
  logo.traverse(o => { if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  logoReady = true; layoutLogo();
});

const floorMap = noiseTex('#4a4844', 30, 400); floorMap.repeat.set(4,2);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(16, 10),
  new THREE.MeshStandardMaterial({ map:floorMap, bumpMap:floorMap, bumpScale:.015, roughness:.82, metalness:0 }));
floor.rotation.x = -Math.PI/2; floor.position.set(0, FLOOR_Y, WALL_Z + 5); floor.receiveShadow = true; scene.add(floor);

// battiscopa
const skirting = new THREE.Mesh(new THREE.BoxGeometry(16, .12, .03),
  new THREE.MeshStandardMaterial({ color:0x2a2926, roughness:.6 }));
skirting.position.set(0, FLOOR_Y + .06, WALL_Z + .015); skirting.receiveShadow = true; scene.add(skirting);

// luce ambiente notturna (per vedere la sagoma a luce spenta)
const moon = new THREE.DirectionalLight(0x8fa6d6, .22); moon.position.set(-3, 2, 6); scene.add(moon);
const amb = new THREE.HemisphereLight(0x3a4560, 0x0a0a0a, .25); scene.add(amb);
// rimbalzo caldo della luce accesa sulle superfici
const bounce = new THREE.HemisphereLight(0xffffff, 0x000000, 0); scene.add(bounce);

/* ---------- lampada ---------- */
const PIVOT_Y = 3.6, CABLE = 1.55;
const pivot = new THREE.Group(); pivot.position.set(0, PIVOT_Y, 0); scene.add(pivot);
const lamp = new THREE.Group(); lamp.position.y = -CABLE; pivot.add(lamp);

const rubber = new THREE.MeshStandardMaterial({ color:0x111111, roughness:.55 });
const brass = new THREE.MeshStandardMaterial({ color:0xb08a4e, metalness:1, roughness:.32 });
const lampEnvMats = [brass];
lampEnvMats.forEach(m => { m.envMap = envTex; m.envMapIntensity = 0; });

  uniforms:{ uColor:{value:new THREE.Color(0xffc27a)}, uLevel:{value:0}, uTime:{value:0}, uH:{value:BEAM_H} },
  vertexShader:`
    uniform float uH; varying float vH; varying vec3 vN; varying vec3 vV; varying vec3 vW;
    void main(){
      vH = -position.y / uH;
      vec4 mv = modelViewMatrix * vec4(position,1.0);
      vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz);
      vW = (modelMatrix * vec4(position,1.0)).xyz;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform vec3 uColor; uniform float uLevel; uniform float uTime;
    varying float vH; varying vec3 vN; varying vec3 vV; varying vec3 vW;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n2(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    void main(){

      float haze = .75 + .25 * n2(vW.xy * 2.2 + vec2(0., uTime * .12));
      float a = facing * fall * haze * uLevel * .32;
      gl_FragColor = vec4(uColor * a, a);
    }`
});

  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  uniforms:{ uTime:{value:0}, uApex:{value:new THREE.Vector3()}, uDir:{value:new THREE.Vector3(0,-1,0)},
             uCos:{value:Math.cos(.74)}, uLevel:{value:0}, uColor:{value:new THREE.Color(0xffc27a)}, uPx:{value:1} },
  vertexShader:`
    attribute float seed; uniform float uTime; uniform vec3 uApex; uniform vec3 uDir; uniform float uCos; uniform float uPx;
    varying float vLit; varying float vSeed;
    void main(){
      vec3 p = position;
      float t = uTime * (.05 + seed * .06);
      p.x += sin(t * 6.283 + seed * 40.) * .18;
      p.y += sin(t * 3.1 + seed * 17.) * .25 - fract(t*.3 + seed) * .0;
      p.z += cos(t * 4.7 + seed * 23.) * .15;
      vec3 d = p - uApex; float dist = length(d);
      float c = dot(d / dist, uDir);
      vLit = smoothstep(uCos, uCos + .12, c) * smoothstep(5.5, .4, dist);
      vSeed = seed;
      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_PointSize = (1.2 + seed * 2.2) * uPx * (6.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader:`
    uniform float uLevel; uniform vec3 uColor; varying float vLit; varying float vSeed;
    void main(){
      vec2 c = gl_PointCoord - .5; float r = dot(c,c);
      if(r > .25) discard;
      float a = smoothstep(.25, .0, r) * vLit * uLevel * (.35 + .65 * vSeed);

    }`
});

/* ---------- audio: clic dell'interruttore a tirante ---------- */
let ac;
function clack(down){
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const len = Math.floor(ac.sampleRate * .03), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 6);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = down ? 2600 : 3600; bp.Q.value = 4;
    const g = ac.createGain(); g.gain.value = .55;
    src.connect(bp).connect(g).connect(ac.destination); src.start();
  }catch(_){}
}

/* ---------- stato luce: sfarfallio + riscaldamento filamento ---------- */
let isOn = false, switchT = -1, lvl = 0, fila = 0, uiOn = 0;
const FLICK = [[0,0],[.03,.85],[.07,.05],[.12,.6],[.16,0],[.21,.9],[.26,.35],[.33,1]];
function flickAt(t){
  for(let i=FLICK.length-1;i>=0;i--) if(t >= FLICK[i][0]) return FLICK[i][1];
  return 0;
}
function toggle(){
  isOn = !isOn; switchT = clockT;
  body.classList.toggle('dark', !isOn);
  clack(isOn);
  // lo scatto dell'interruttore dà un colpetto alla lampada
  omegaZ += (isOn ? -1 : 1) * .2; omegaX += .08;
  if(isOn) setTimeout(() => document.getElementById('email').focus({ preventScroll:true }), 700);
}

/* ---------- fisica pendolo ---------- */
let thZ = 0, thX = 0, omegaZ = 0, omegaX = 0;
const G_L = 9.8 / (CABLE + .3), DAMP = .6;

/* ---------- interazione cordicella ---------- */
const grab = document.getElementById('grab'), hint = document.getElementById('hint');
const ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0,0,1), 0), ndc = new THREE.Vector2();
let dragging = false, dragStart = null, dragMoved = 0, dragWorld = new THREE.Vector3(), maxStretch = 0;
function pointerWorld(e){
  ndc.set(e.clientX / W * 2 - 1, -(e.clientY / H) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  plane.constant = -rope[SEGS].z;
  ray.ray.intersectPlane(plane, dragWorld);
}
grab.addEventListener('pointerdown', e => {
  dragging = true; dragMoved = 0; maxStretch = 0; dragStart = [e.clientX, e.clientY];
  grab.setPointerCapture(e.pointerId); pointerWorld(e);
});
grab.addEventListener('pointermove', e => {
  if(!dragging) return;
  dragMoved = Math.max(dragMoved, Math.hypot(e.clientX - dragStart[0], e.clientY - dragStart[1]));
  pointerWorld(e);
});
function endDrag(){
  if(!dragging) return; dragging = false;
  if(dragMoved < 6){                       // tap: tirata automatica
    autoPull = 1; return;
  }
  if(maxStretch > .07) toggle();
}
grab.addEventListener('pointerup', endDrag); grab.addEventListener('pointercancel', endDrag);
grab.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); autoPull = 1; } });
grab.addEventListener('click', e => e.preventDefault());

let autoPull = 0;  // animazione di tirata per tap / tastiera (0 = ferma)

/* ---------- sensori del telefono: inclinazione + scossoni ---------- */
// regolazioni sensori: tilt = quanto conta l'inclinazione, shake = scossoni, deadzone = vibrazioni ignorate (m/s²)
const MOTION = { tilt: .5, shake: .45, deadzone: 1.2, smooth: 3 };
let tilt = 0, tiltSm = 0, accX = 0, accY = 0, motionAsked = false;
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onOrient(e){
  if(e.gamma == null) return;
  const a = ((screenAngle() % 360) + 360) % 360;
  let t = a === 90 ? -e.beta : a === 270 ? e.beta : a === 180 ? -e.gamma : e.gamma;
  // verso invertito + metà sensibilità (tarato sul telefono di Mauro)
  tilt = -THREE.MathUtils.degToRad(THREE.MathUtils.clamp(t, -45, 45)) * MOTION.tilt; gotMotion();
}
function onMotion(e){
  const m = e.acceleration; if(!m || m.x == null) return;
  const a = ((screenAngle() % 360) + 360) % 360;
  let x = m.x, y = m.y;
  if(a === 90){ [x, y] = [-m.y, m.x]; } else if(a === 270){ [x, y] = [m.y, -m.x]; } else if(a === 180){ x = -m.x; y = -m.y; }
  const dz = v => Math.abs(v) < MOTION.deadzone ? 0 : v - Math.sign(v) * MOTION.deadzone;
  accX = THREE.MathUtils.clamp(dz(x), -15, 15) * MOTION.shake; accY = THREE.MathUtils.clamp(dz(y), -15, 15) * MOTION.shake; gotMotion();
}
function listenMotion(){ addEventListener('deviceorientation', onOrient); addEventListener('devicemotion', onMotion); }
let motionLive = false;
const chip = document.getElementById('motionChip');
function setChip(txt, cls){ chip.textContent = txt; chip.className = cls || ''; }
function gotMotion(){
  if(motionLive) return; motionLive = true;
  setChip('📱 Sensori attivi', 'ok'); setTimeout(() => chip.classList.add('hide'), 1800);
}
const needsPerm = !!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function');
function askMotion(){
  if(motionLive || motionAsked) return;
  try{
    const DOE = window.DeviceOrientationEvent, DME = window.DeviceMotionEvent;
    if(needsPerm){
      motionAsked = true;
      // iOS vuole la richiesta dentro un "click"/"touchend": chiamate dirette, nessun await prima
      const p1 = DOE.requestPermission();
      const p2 = DME && typeof DME.requestPermission === 'function' ? DME.requestPermission() : Promise.resolve('granted');
      Promise.all([p1, p2]).then(r => {
        if(r.includes('granted')){ listenMotion(); setChip('📱 Muovi il telefono…', 'ok'); }
        else if(navigator.maxTouchPoints > 0){ setChip('Sensori negati: ricarica la pagina e premi Consenti', 'err'); setTimeout(() => chip.classList.add('hide'), 6000); }
        else chip.classList.add('hide');
      }).catch(() => { motionAsked = false; setChip('📱 Tocca qui per attivare i sensori', ''); });
    }else listenMotion();
  }catch(_){ motionAsked = false; }
}
// in ascolto da subito (Android); su iOS gli eventi arrivano solo dopo il permesso
listenMotion();
if(needsPerm && navigator.maxTouchPoints > 0) setChip('📱 Tocca qui per attivare i sensori', '');
chip.addEventListener('click', e => { e.stopPropagation(); askMotion(); });
addEventListener('touchend', askMotion, { passive:true });
addEventListener('click', askMotion);
// nessun dato dopo 4 s su un dispositivo senza permessi da chiedere → lo dico
setTimeout(() => { if(!motionLive && !needsPerm && navigator.maxTouchPoints > 0) setChip('Sensori di movimento non disponibili su questo dispositivo', 'err'); }, 4000);

// parallasse leggera
let px = 0, py = 0;
addEventListener('pointermove', e => { if(!dragging){ px = e.clientX / W - .5; py = e.clientY / H - .5; } });

/* ---------- loop ---------- */
const clock = new THREE.Clock(); let clockT = 0;
const apex = new THREE.Vector3(), dir = new THREE.Vector3(), q = new THREE.Quaternion();
const spotOnScreen = new THREE.Vector3();
const card = document.getElementById('card');

function step(dt){
  clockT += dt;

  // --- livello luce ---
  if(isOn){
    const t = clockT - switchT;
    lvl = t < .33 ? flickAt(t) : Math.min(1, lvl + dt * 6);
    fila = Math.min(1, fila + dt * 2.2);
  }else{
    lvl = Math.max(0, lvl - dt * 14);
    fila = Math.max(0, fila - dt * 2.6);   // il filamento resta arancio un attimo
  }
  uiOn += ((isOn ? Math.min(1, lvl) : 0) - uiOn) * Math.min(1, dt * (isOn ? 5 : 9));
  if(uiOn > .995) uiOn = isOn ? 1 : uiOn; if(uiOn < .005 && !isOn) uiOn = 0;
  root.style.setProperty('--on', uiOn.toFixed(3));
  card.style.filter = uiOn > .97 ? 'none' : '';

  const col = warmCol.clone().lerp(lightCol, Math.pow(fila, .6));
  spot.color.copy(col); glow.color.copy(col);
  spot.intensity = lvl * 95 * (.55 + .45 * fila);
  glow.intensity = lvl * 1.4;
  wide.color.copy(col); wide.intensity = lvl * LOGO_LIGHT * (.55 + .45 * fila);
  for(const m of envMats) m.envMapIntensity = lvl * .32;
  for(const m of lampEnvMats) m.envMapIntensity = lvl * .35;
  bounce.color.copy(col); bounce.intensity = lvl * .12;
  glass.emissive.copy(col); glass.emissiveIntensity = Math.max(lvl, fila * .35) * 9;
  fil.material.color.copy(col).multiplyScalar(Math.max(lvl, fila * .6) * 6);
  inner.emissive.copy(col); inner.emissiveIntensity = lvl * .18;
  beamMat.uniforms.uColor.value.copy(col); beamMat.uniforms.uLevel.value = lvl * (.6 + .4 * fila);
  beamMat.uniforms.uTime.value = clockT;
  dustMat.uniforms.uColor.value.copy(col); dustMat.uniforms.uLevel.value = lvl;
  dustMat.uniforms.uTime.value = clockT;
  moon.intensity = .22 * (1 - lvl * .5);
  // pomello e cordicella fosforescenti al buio, pulsano piano per farsi trovare
  const dark = 1 - Math.min(1, lvl);
  const pulse = .55 + .45 * Math.sin(clockT * 2.6);
  knobMat.emissive.copy(lightCol); knobMat.emissiveIntensity = dark * (1.6 + 1.8 * pulse);
  cordMat.emissive.copy(lightCol); cordMat.emissiveIntensity = dark * (.25 + .2 * pulse);

  // --- corda: obiettivo trascinamento / tirata automatica ---
  let pinEnd = null;
  anchorWorld(tmpV);
  const restEnd = tmpV.clone(); restEnd.y -= ROPE_L;
  if(dragging){
    pinEnd = dragWorld.clone();
  }else if(autoPull > 0){
    autoPull += dt * 3.2;
    const k = autoPull - 1;                // 0..1 giù, poi rilascio
    const depth = Math.sin(Math.min(1, k) * Math.PI) * .16;
    pinEnd = restEnd.clone(); pinEnd.y -= depth;
    if(k >= 1){ autoPull = 0; toggle(); }
  }
  if(pinEnd){
    // limite di allungamento della cordicella elastica
    const off = pinEnd.clone().sub(tmpV); const L = off.length(), maxL = ROPE_L * 1.32;
    if(L > maxL) pinEnd.copy(tmpV).addScaledVector(off.normalize(), maxL);
    maxStretch = Math.max(maxStretch, Math.min(L, maxL) - ROPE_L);
    // la tirata fa coppia sulla lampada
    const F = pinEnd.clone().sub(restEnd).multiplyScalar(14);
    const r = tmpV.clone().sub(pivot.getWorldPosition(new THREE.Vector3()));
    const torque = r.clone().cross(F);
    omegaZ += torque.z * dt * .5; omegaX += torque.x * dt * .5;
  }

  // --- pendolo ---
  const air = Math.sin(clockT * .7) * .012 + Math.sin(clockT * 1.9 + 1) * .006;
  // la lampada pende sempre verso il basso "vero": se inclini il telefono si riallinea
  tiltSm += (tilt - tiltSm) * Math.min(1, dt * MOTION.smooth);
  omegaZ += (-G_L * Math.sin(thZ - THREE.MathUtils.clamp(tiltSm * .45, -.28, .28)) - DAMP * omegaZ + air - accX * .05) * dt;
  omegaX += (accY * .03) * dt;
  omegaX += (-G_L * Math.sin(thX) - DAMP * omegaX) * dt;
  thZ += omegaZ * dt; thX += omegaX * dt;
  pivot.rotation.set(thX, 0, thZ);
  pivot.updateMatrixWorld(true);

  // --- verlet della corda ---
  anchorWorld(tmpV);
  // gravità ruotata con l'inclinazione + inerzia degli scossoni (verso opposto all'accelerazione)
  const gx = (9.8 * Math.sin(tiltSm) - accX * .9) * dt * dt;
  const gy = (-9.8 * Math.cos(tiltSm) - accY * .9) * dt * dt;
  for(let i=1;i<=SEGS;i++){
    const p = rope[i], o = ropePrev[i];
    const vx = (p.x - o.x) * .985, vy = (p.y - o.y) * .985, vz = (p.z - o.z) * .985;
    o.copy(p); p.x += vx + gx; p.y += vy + gy; p.z += vz;
  }
  rope[0].copy(tmpV);
  const segL = pinEnd ? Math.max(SEG_L, pinEnd.distanceTo(tmpV) / SEGS) : SEG_L;
  for(let it=0; it<14; it++){
    if(pinEnd) rope[SEGS].copy(pinEnd);
    rope[0].copy(tmpV);
    for(let i=0;i<SEGS;i++){
      const a = rope[i], b = rope[i+1];
      const d = b.clone().sub(a), len = d.length() || 1e-6, diff = (len - segL) / len;
      if(i === 0){ b.addScaledVector(d, -diff); }
      else { a.addScaledVector(d, diff * .5); b.addScaledVector(d, -diff * .5); }
    }
  }
  // non attraversa il muro
  for(const p of rope) if(p.z < WALL_Z + .02) p.z = WALL_Z + .02;
}

function render(){
  const dt = Math.min(clock.getDelta(), 1/30);
  // sotto-passi per stabilità
  step(dt/2); step(dt/2);

  // mesh corda
  if(cordMesh){ cordMesh.geometry.dispose(); scene.remove(cordMesh); }
  const curve = new THREE.CatmullRomCurve3(rope);
  cordMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 40, .0055, 6, false), cordMat);
  cordMesh.castShadow = true; scene.add(cordMesh);
  const end = rope[SEGS], prev = rope[SEGS-1];
  dir.subVectors(end, prev).normalize();
  knob.position.copy(end).addScaledVector(dir, .035);
  q.setFromUnitVectors(new THREE.Vector3(0,1,0), dir); knob.quaternion.copy(q);

  // camera con leggera parallasse
  camera.position.x += (px * .35 - camera.position.x) * .04;
  camera.position.y += (baseCamY - py * .2 - camera.position.y) * .04;
  camera.position.z = baseCamZ;
  camera.lookAt(0, baseCamY, WALL_Z);

  // pulviscolo: apice e direzione del cono in coordinate mondo
  bulb.getWorldPosition(apex);
  dir.set(0,-1,0).applyQuaternion(lamp.getWorldQuaternion(q));
  dustMat.uniforms.uApex.value.copy(apex); dustMat.uniforms.uDir.value.copy(dir);

  // zona presa + suggerimento sullo schermo
  const s = knob.position.clone().project(camera);
  const sx = (s.x + 1) / 2 * W, sy = (1 - s.y) / 2 * H;
  grab.style.transform = `translate(${sx}px, ${sy}px)`;
  hint.style.transform = `translate(${sx + 22}px, ${sy - 8}px)`;

  // punto luce riportato sulla card (per l'illuminazione CSS)
  spotOnScreen.copy(apex).addScaledVector(dir, 2.4).project(camera);
  const r = card.getBoundingClientRect();
  const lx = ((spotOnScreen.x + 1) / 2 * W - r.left) / r.width * 100;
  const ly = ((1 - spotOnScreen.y) / 2 * H - r.top) / r.height * 100;
  root.style.setProperty('--lx', lx.toFixed(1) + '%');
  root.style.setProperty('--ly', (ly - 60).toFixed(1) + '%');

  composer.render();
  requestAnimationFrame(render);
}
window.__glReady = true;
window.__lamp = { toggle: () => toggle() };
render();
</script>
</body>
