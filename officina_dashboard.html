<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Officina · DepoTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#1c1f24;--bg2:#23272d;--surf:#2a2e35;--surf2:#31363e;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);
  --txt:#eef0f3;--mut:#9aa1ab;--acc:#f26b2a;--acc2:#ff9a5c;--ok:#3ddc97;--bad:#ff5d5d;--warn:#ffc247;--tmp:#b57bff;
  --sh-out:6px 6px 14px rgba(0,0,0,.38),-3px -3px 10px rgba(255,255,255,.035);
  --sh-in:inset 4px 4px 10px rgba(0,0,0,.42),inset -2px -2px 7px rgba(255,255,255,.035);
  --f:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 600px at 10% -10%,#2a2f37 0,transparent 60%),var(--bg);color:var(--txt);font:14px/1.4 var(--f);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
#app{min-height:100%;display:flex;flex-direction:column;gap:14px;padding:14px 16px 16px}
/* barra */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--acc2),var(--acc));color:#1a0d05;font-size:19px;box-shadow:0 0 18px rgba(242,107,42,.35)}
.brand h1{margin:0;font-size:18px;font-weight:900;letter-spacing:.14em}
.brand small{display:block;font-family:var(--fm);font-size:11px;color:var(--mut);letter-spacing:.04em}
.live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(61,220,151,.6);animation:lv 2s infinite;margin-right:6px;vertical-align:1px}
.live.off{background:var(--bad);animation:none}.live.wait{background:var(--warn)}
@keyframes lv{70%{box-shadow:0 0 0 7px rgba(61,220,151,0)}}
.sp{flex:1}
.clk{font-family:var(--fm);font-weight:800;font-size:20px;letter-spacing:.04em;padding:6px 14px;border-radius:12px;background:var(--bg2);box-shadow:var(--sh-in);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:12px;background:var(--surf);box-shadow:var(--sh-out);font-weight:700;font-size:13px;border:1px solid var(--line);transition:transform .15s,box-shadow .15s,border-color .15s}
.btn:hover{border-color:rgba(242,107,42,.5)}
.btn:active{box-shadow:var(--sh-in);transform:translateY(1px)}
.btn.pri{background:linear-gradient(145deg,var(--acc2),var(--acc));color:#1a0d05;border-color:transparent;box-shadow:0 6px 18px rgba(242,107,42,.35)}
.btn.danger{background:rgba(255,93,93,.14);color:#ff8a8a;border-color:rgba(255,93,93,.35)}
.btn.on{border-color:var(--acc);color:var(--acc2)}
.user{font-size:12px;font-weight:700}.user small{font-family:var(--fm);color:var(--acc2);margin-left:4px}
/* riquadri */
.kpi{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.k{--c:var(--acc);position:relative;display:flex;align-items:center;gap:14px;min-width:0;padding:14px 16px 14px 20px;border-radius:20px;background:var(--surf);box-shadow:var(--sh-out);border:1px solid var(--line);text-align:left;transition:border-color .2s,transform .2s}
.k:hover{border-color:color-mix(in srgb,var(--c) 55%,transparent);transform:translateY(-2px)}
.k::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c);box-shadow:0 0 12px var(--c)}
.k .kl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);font-weight:800}
.k .kv{font-weight:900;font-size:clamp(26px,3.4vw,38px);line-height:1.08;font-variant-numeric:tabular-nums}
.k .kv small{font-size:.5em;color:var(--mut);font-weight:700}
.k .kn{font-size:12.5px;color:var(--mut);line-height:1.45}.k .kn b{color:var(--txt)}
.k .ic{flex:none;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:var(--bg2);box-shadow:var(--sh-in)}
.k .donut{flex:none;width:84px;height:84px}
.k .donut text{fill:var(--txt);font:800 19px var(--f)}
.k.r-ok{--c:var(--ok)}.k.r-warn{--c:var(--warn)}.k.r-bad{--c:var(--bad);animation:kp 1.6s ease-in-out infinite}
@keyframes kp{50%{box-shadow:var(--sh-out),0 0 0 4px rgba(255,93,93,.3)}}
/* postazioni */
.bay{flex:1;display:grid;grid-template-columns:3fr 7fr 2fr;gap:10px;align-items:stretch;min-height:0}
.blk{min-width:0;display:flex;flex-direction:column;padding:10px 8px;border-radius:22px;background:var(--bg2);box-shadow:var(--sh-in);border:1px solid var(--line)}
.blk h2{display:flex;justify-content:space-between;gap:8px;margin:2px 4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:800}
.blk h2 em{font-style:normal;font-family:var(--fm);color:var(--acc2)}
.slots{flex:1;display:grid;gap:6px;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.bc{min-width:0;display:flex;flex-direction:column;gap:5px;padding:6px 4px 4px;border-radius:16px;background:var(--surf);box-shadow:var(--sh-out);border:1px solid var(--line)}
.bh{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.p{--c:var(--line2);container-type:inline-size;position:relative;flex:1;min-width:0;min-height:104px;display:flex;flex-direction:column;gap:3px;padding:7px 6px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);border-top:4px solid var(--c);cursor:pointer;transition:transform .15s}
.p .pn{position:absolute;top:4px;right:7px;font-family:var(--fm);font-size:10px;font-weight:800;color:var(--mut);opacity:.8}
.p:hover{transform:translateY(-1px)}
.p:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.p.free{background:var(--bg2);box-shadow:var(--sh-in);border:1.5px dashed var(--line2)}
.p.x2{border-top-color:transparent;background-image:linear-gradient(90deg,var(--c) 50%,var(--c2) 50%);background-size:100% 4px;background-repeat:no-repeat}
.p.fer{animation:pp 1.8s ease-in-out infinite}
@keyframes pp{50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 45%,transparent)}}
.bh .pid{font-family:var(--fm);font-size:12px;font-weight:800;color:var(--mut)}
.lw{position:relative;display:flex;align-items:center;gap:3px;min-width:0;margin:0 -4px;padding:3px 5px;border-radius:8px;font-weight:800;line-height:1.2;color:var(--acc2)}
.fit{display:block;min-width:0;white-space:nowrap;overflow:hidden}
.lw .lt{flex:1 1 auto}
.lw.empty{color:var(--mut);font-weight:600}
.lw.ed{cursor:pointer}.lw.ed:hover{background:rgba(255,255,255,.06)}.lw.ed::after{content:"▾";flex:none;font-size:9px;color:var(--mut)}
.lw.ed:focus-within{outline:2px solid var(--acc)}
.lw select{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px}
.p .on{font-weight:900;line-height:1.05;margin-top:9px;font-variant-numeric:tabular-nums}
.p .om{color:var(--mut)}
.p .pst{min-width:0;font-weight:800;line-height:1.25;letter-spacing:-.01em;color:var(--c)}
.p.x2 .pst span+span{color:var(--c2)}
.p .of{margin-top:auto;display:flex;flex-direction:column;min-width:0;font-family:var(--fm);color:var(--mut)}
.p .oe{margin:auto 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11.5px;text-align:center}
.p .oe b{font-size:22px;font-weight:300;line-height:1}
.p.miss{opacity:.7}
.foot{font-family:var(--fm);font-size:11px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.p.tw{box-shadow:inset 0 0 0 2px var(--warn)}.p.tb{box-shadow:inset 0 0 0 2px var(--bad);animation:pp 1.8s ease-in-out infinite}
.p.tw .tm{color:var(--warn);font-weight:800}.p.tb .tm{color:var(--bad);font-weight:800}
.today{display:flex;align-items:center;gap:10px;min-width:0;padding:8px 10px;border-radius:16px;background:var(--bg2);box-shadow:var(--sh-in);border:1px solid var(--line)}
.today .th{flex:none;font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--mut);white-space:nowrap}
.today .th b{color:var(--txt)}
.tl{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.tl .ev{flex:none;display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:12px;white-space:nowrap}
.tl .ev time{font-family:var(--fm);color:var(--mut);font-size:11px}
.tl .ev i{font-style:normal;font-weight:900}.tl .ev.in i{color:var(--ok)}.tl .ev.out i{color:var(--acc2)}.tl .ev.mv i{color:var(--warn)}
.tl .ev small{color:var(--mut)}
.tl .none{color:var(--mut);font-size:12px}
.sto{max-height:52vh;overflow:auto;border-radius:12px;background:var(--bg2);box-shadow:var(--sh-in)}
.sto table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.sto th{position:sticky;top:0;background:var(--surf2);text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:8px 10px;white-space:nowrap}
.sto td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}
.sto td small{display:block;color:var(--mut);font-size:11px}
.sto .dentro{color:var(--acc2);font-weight:800}
.today .th{cursor:pointer}.today .th:hover{color:var(--acc2)}
/* finestre */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,9,11,.6);backdrop-filter:blur(6px)}
.md{width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;border-radius:22px;background:var(--surf);border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6)}
.md.wide{width:min(760px,100%)}
.mh{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}.mh h3{margin:0;flex:1;font-size:18px;font-weight:800}
.mh .x{width:32px;height:32px;border-radius:10px;background:var(--bg2);box-shadow:var(--sh-in);font-size:18px}
.mb{padding:4px 18px 14px;overflow:auto}
.mf{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 18px 16px;border-top:1px solid var(--line)}
.field{width:100%;padding:10px 12px;border-radius:12px;background:var(--bg2);box-shadow:var(--sh-in);border:1.5px solid transparent;outline:none}
.field:focus{border-color:var(--acc)}
.frm{display:grid;gap:10px}.frm2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sub{color:var(--mut);font-size:13px}
.lab{font-size:12px;color:var(--mut);margin-bottom:4px}
.err{color:#ff8a8a;font-size:13px;min-height:1em}
.list{display:grid;gap:4px;max-height:52vh;overflow:auto;margin-top:10px}
.r{--c:var(--mut);display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:12px;text-align:left;border-left:4px solid var(--c);background:rgba(255,255,255,.025)}
.r:hover{background:rgba(255,255,255,.07)}
.r b{min-width:54px;font-size:16px}.r em{flex:1;min-width:0;font-style:normal;color:var(--mut);font-size:13px}.r span{font-family:var(--fm);font-size:12px;color:var(--mut)}
.det{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}.det dt{color:var(--mut)}.det dd{margin:0;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips button{padding:9px 13px;border-radius:12px;background:var(--bg2);border:1px solid var(--line2);font-family:var(--fm);font-weight:700}
.chips button:hover{border-color:var(--acc)}
.rbig{--c:var(--warn);padding:12px 14px;border-radius:14px;margin-bottom:12px;font-weight:800;font-size:16px;background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.hist{display:grid;gap:4px;margin-top:6px;font-size:13px}.hist div{display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.fbar{display:grid;grid-template-columns:minmax(0,170px) 1fr 34px;gap:10px;align-items:center;font-size:13px;margin:5px 0}.fbar i{display:block;height:10px;border-radius:6px;background:var(--c)}.fbar b{text-align:right}
#toast{position:fixed;left:50%;bottom:18px;z-index:80;transform:translate(-50%,30px);opacity:0;pointer-events:none;padding:11px 18px;border-radius:14px;background:var(--surf2);border:1px solid var(--line2);box-shadow:0 14px 40px rgba(0,0,0,.5);font-weight:700;transition:all .25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ph{flex:1;display:grid;place-items:center;text-align:center;color:var(--mut);gap:12px;padding:40px}
/* finestra stretta / primo piano piccolo */
@media (max-width:1100px){.bay{grid-template-columns:1fr 1fr}.blk.bC{grid-column:1/-1;order:-1}.blk.bC .slots{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media (max-width:820px){.kpi{grid-template-columns:1fr}.blk.bC .slots{grid-template-columns:repeat(4,minmax(0,1fr))}.clk{font-size:16px}}
@media (max-width:520px){#app{padding:10px}.bay{grid-template-columns:1fr}.blk.bC{order:0}.slots,.blk.bC .slots{grid-template-columns:repeat(2,minmax(0,1fr))}.blk.bL .slots{grid-template-columns:repeat(3,minmax(0,1fr))}.brand small{display:none}.btn .t{display:none}}
@media (max-height:620px) and (min-width:821px){.k{padding-block:10px}.k .donut{width:66px;height:66px}.k .ic{width:48px;height:48px;font-size:22px}.p{min-height:84px}.p .om{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><span class="mk">🔧</span><div><h1>OFFICINA</h1><small><span class="live wait" id="dot"></span><span id="st">collegamento…</span></small></div></div>

</div>

<script>
(function(){
'use strict';

function $(s,r){return (r||DOCX).querySelector(s)}
function $$(s,r){return [].slice.call((r||DOCX).querySelectorAll(s))}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function arr(x){if(!x)return [];if(Array.isArray(x))return x.filter(Boolean);return Object.keys(x).map(function(k){return x[k]}).filter(Boolean)}
function nk(p){return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,6)}

var CFG={apiKey:"AIzaSyB6iU__138sUB4Tw_9DKWeat4WkN2RkVng",authDomain:"depotrack-d1d28.firebaseapp.com",databaseURL:"https://depotrack-d1d28-default-rtdb.europe-west1.firebasedatabase.app",projectId:"depotrack-d1d28",appId:"1:967480447300:web:7e79395a45964cdf348711"};

/* ---------- utilità ---------- */
var tt;function toast(m){var t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},2600)}

function sogl(){var g=OFF.soglie||{},w=+g.warn,b=+g.bad;if(!(w>0))w=8;if(!(b>0))b=24;if(b<=w)b=w+1;return {w:w,b:b}}

function day0(t){var d=new Date(t);d.setHours(0,0,0,0);return d.getTime()}
function fmtD(t){return t?new Date(t).toLocaleDateString('it-IT',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}):'—'}
function isoD(t){var d=new Date(t);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function parseD(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():null}
function su(){return LIVE&&ME.role==='superuser'}
function canEdit(){
  if(!LIVE){toast('Database non collegato: niente da salvare');return false}
  if(!ME.uid){openLogin();return false}
  if(ME.role!=='superuser'){toast('Solo il superuser modifica le postazioni');return false}

}

/* ---------- finestre ---------- */
function modal(o){
  var sc=DOCX.createElement('div');sc.className='scrim';
  sc.innerHTML='<div class="md'+(o.wide?' wide':'')+'" role="dialog" aria-label="'+esc(o.title||'')+'"><div class="mh"><h3>'+esc(o.title||'')+'</h3><button class="x" aria-label="Chiudi">×</button></div><div class="mb">'+(o.html||'')+'</div>'+(o.foot&&o.foot.length?'<div class="mf"></div>':'')+'</div>';
  DOCX.body.appendChild(sc);
  var M={el:sc,close:function(){if(sc.parentNode)sc.parentNode.removeChild(sc)}};
  $('.x',sc).onclick=M.close;
  sc.addEventListener('pointerdown',function(e){if(e.target===sc)M.close()});
  sc.addEventListener('keydown',function(e){if(e.key==='Escape')M.close()});
  if(o.foot)o.foot.forEach(function(b){var x=DOCX.createElement('button');x.className='btn'+(b.cls?' '+b.cls:'');x.textContent=b.label;x.onclick=function(){if(b.fn)b.fn();if(!b.keep)M.close()};$('.mf',sc).appendChild(x)});

/* ---------- dati ---------- */
function ingest(d){
  TIPI={};arr(d.tipi).forEach(function(t){TIPI[t.id]={nome:t.nome||t.id}});
  ST={};ORDER=[];arr(d.stati).forEach(function(s){ST[s.id]=[s.nome||s.id,s.colore||'#7d8590'];ORDER.push(s.id)});
  var stallOf={},asg=d.assign||{};Object.keys(asg).forEach(function(sid){stallOf[asg[sid]]=sid});
  var fl=d.fleet||{};V=[];BYID={};
  Object.keys(fl).forEach(function(k){
    var f=fl[k];if(!f)return;if(!ST[f.stato]){ST[f.stato]=[f.stato||'?','#7d8590'];ORDER.push(f.stato)}
    var v={id:String(f.id),n:String(f.targa!=null?f.targa:f.id),model:f.model||'',tipo:f.type,s:f.stato,x:(f.extra&&ST[f.extra])?f.extra:null,note:f.note||'',stall:stallOf[f.id]||null};
    V.push(v);BYID[v.id]=v;
  });
}
function offIngest(o){
  o=o||{};var raw=o.post||{},post={};RK={};
  Object.keys(raw).forEach(function(k){if(/^[LCR]\d+[ab]$/.test(k)){post[k]=raw[k];RK[k]=k}});
  Object.keys(raw).forEach(function(k){if(/^[LCR]\d+$/.test(k)){var h=post[k+'a']?k+'b':k+'a';if(!post[h]){post[h]=raw[k];RK[h]=k}}});/* vecchie postazioni singole -> posto 1 */
  OFF={post:post,label:o.label||{},etichette:arr(o.etichette).map(String),blocchi:o.blocchi||{},soglie:o.soglie||{}};
  OFFBY={};Object.keys(OFF.post).forEach(function(p){var x=OFF.post[p];if(x&&x.vid)OFFBY[x.vid]=p});
}
function rentriSt(){
  var r=RENTRI||{};if(!r.next)return {cls:'r-warn',t:'Nessuna scadenza impostata'};
  var d=Math.round((day0(r.next)-day0(Date.now()))/864e5);
  if(d<0)return {cls:'r-bad',t:'Scaduto da '+(-d)+(d===-1?' giorno':' giorni')};
  if(d===0)return {cls:'r-bad',t:'Scade OGGI'};
  if(d<=2)return {cls:'r-warn',t:'Scade tra '+d+(d===1?' giorno':' giorni')};
  return {cls:'r-ok',t:'Tra '+d+' giorni'};
}

/* ---------- azioni ---------- */
function onPost(pid){
  var x=OFF.post[pid],v=x&&BYID[x.vid];
  if(!x){if(canEdit())pickVeh(pid);return}
  var lab=OFF.label[bayOf(pid)]||'';
  var html='<dl class="det"><dt>Vettura</dt><dd>'+esc(v?v.n:(x.n||'?'))+(v?' · '+esc(modelOf(v)):' · non più in flotta')+'</dd>'
    +(v?'<dt>Stato</dt><dd style="color:'+stOf(v.s)[1]+'">● '+esc(stOf(v.s)[0])+(v.x?' + '+esc(stOf(v.x)[0]):'')+'</dd>':'')
    +'<dt>Etichetta</dt><dd>'+(lab?esc(lab):'—')+'</dd>'
    +'<dt>Stallo</dt><dd>'+(v&&v.stall?esc(shortSid(v.stall))+' (resta suo)':'senza stallo')+'</dd>'
    +'<dt>In officina da</dt><dd>'+durTxt(x.ts)+(x.by?' · inserita da '+esc(x.by):'')+'</dd>'
    +(v&&v.note?'<dt>Note</dt><dd>'+esc(v.note)+'</dd>':'')+'</dl>';
  modal({title:'🔧 Posto '+pname(pid)+(lab?' · '+lab:''),html:html,foot:su()?[{label:'Sposta',fn:function(){pickPost(pid)}},{label:'Togli',cls:'danger',fn:function(){remove(pid)}}]:[]});
}
function pickVeh(pid){
  var M=modal({title:'Inserisci nel posto '+pname(pid),html:'<input class="field" id="q" placeholder="Numero vettura o modello…" autocomplete="off" inputmode="search"><div class="sub" style="margin-top:8px">Prima i mezzi fermi. Lo stato non cambia e lo stallo resta suo.</div><div class="list" id="ql"></div>'});
  var q=$('#q',M.el),l=$('#ql',M.el);
  function draw(){
    var s=q.value.trim().toLowerCase();
    var list=sortedV().filter(function(v){return !s||(v.n+' '+modelOf(v)+' '+stOf(v.s)[0]).toLowerCase().indexOf(s)>-1});
    list=list.filter(function(v){return isFerma(v.s)}).concat(list.filter(function(v){return !isFerma(v.s)})).slice(0,40);
    l.innerHTML=list.map(function(v){var p=offOf(v.id);return '<button class="r" data-id="'+esc(v.id)+'" style="--c:'+stOf(v.s)[1]+'"><b>'+esc(v.n)+'</b><em>'+esc(modelOf(v))+' · '+esc(stOf(v.s)[0])+'</em><span>'+(p?'già in '+pname(p):(v.stall?esc(shortSid(v.stall)):'senza stallo'))+'</span></button>'}).join('')||'<p class="sub" style="padding:10px">Nessun mezzo trovato.</p>';
    $$('.r',l).forEach(function(b){b.onclick=function(){M.close();put(pid,b.dataset.id)}});
  }
  q.oninput=draw;q.onkeydown=function(e){if(e.key==='Enter'){var f=$('.r',l);if(f)f.click()}};
  draw();setTimeout(function(){q.focus()},40);
}
function pickPost(from){
  var free=[];OBLK.forEach(function(bk){for(var i=1;i<=bk.n;i++)['a','b'].forEach(function(s2){if(!OFF.post[bk.k+i+s2])free.push(bk.k+i+s2)})});
  if(!free.length){toast('Nessun posto libero');return}
  var M=modal({title:'Sposta da '+pname(from)+' a…',html:'<div class="chips">'+free.map(function(p){var l=OFF.label[bayOf(p)];return '<button data-p="'+p+'">'+pname(p)+(l?' · '+esc(l):'')+'</button>'}).join('')+'</div>'});
  $$('.chips button',M.el).forEach(function(b){b.onclick=function(){M.close();var x=OFF.post[from];if(x&&x.vid)put(b.dataset.p,x.vid)}});
}
function put(pid,vid){
  if(!canEdit())return;var v=BYID[vid];if(!v)return;
  var old=offOf(vid);if(old===pid)return;
  var up={},prev=old?OFF.post[old]:null,ts=prev&&prev.ts?prev.ts:Date.now(),rid=prev&&prev.rid?prev.rid:nk('o'),lab=OFF.label[bayOf(pid)]||'';
  if(old)up['post/'+(RK[old]||old)]=null;
  up['post/'+pid]={vid:v.id,n:v.n,ts:ts,by:prev&&prev.by?prev.by:(ME.name||''),rid:rid};
  /* storico permanente: una riga per ogni passaggio in officina */
  if(prev&&prev.rid)DB.ref('depotrack_officina_storico/'+rid).update({posto:pname(pid),lab:lab||null}).catch(function(){});
  else DB.ref('depotrack_officina_storico/'+rid).set({vid:v.id,n:v.n,model:modelOf(v)||'',posto:pname(pid),lab:lab||null,in:ts,by:ME.name||''}).catch(function(){});
  DB.ref('depotrack_officina').update(up).then(function(){toast('Vet. '+v.n+' → posto '+pname(pid))}).catch(werr);
  var lab=OFF.label[bayOf(pid)];
  addLog('officina','Vet. '+v.n+' → Officina '+pname(pid)+(lab?' ('+lab+')':'')+(old?' (da '+pname(old)+')':''),v.id);
}
function remove(pid){
  if(!canEdit())return;var x=OFF.post[pid];if(!x)return;var v=BYID[x.vid],n=v?v.n:(x.n||'?');
  confirmBox('Togliere '+n+' da '+pname(pid)+'?','Lo stato del mezzo non cambia: se è riparato, aggiornalo dalla sua scheda in Aurora.',function(){
    DB.ref('depotrack_officina/post/'+(RK[pid]||pid)).remove().then(function(){toast('Posto '+pname(pid)+' liberato')}).catch(werr);
    var now=Date.now(),out={out:now,outBy:ME.name||'',dur:now-(x.ts||now),statoOut:v?stOf(v.s)[0]:null};
    if(x.rid)DB.ref('depotrack_officina_storico/'+x.rid).update(out).catch(function(){});
    else{out.vid=x.vid;out.n=n;out.model=v?modelOf(v):'';out.posto=pname(pid);out.lab=OFF.label[bayOf(pid)]||null;out.in=x.ts||now;out.by=x.by||'';DB.ref('depotrack_officina_storico/'+nk('o')).set(out).catch(function(){})}
    addLog('officina','Vet. '+n+' esce dall\'officina '+pname(pid)+' dopo '+durTxt(x.ts),x.vid);
  },'Togli');
}
function setLabel(pid,val){if(!canEdit()){render();return}DB.ref('depotrack_officina/label/'+pid).set(val||null).catch(werr)}
function durShort(ms){if(!(ms>=0))return '—';var m=Math.round(ms/60000);if(m<60)return m+' min';var h=Math.floor(m/60);if(h<24)return h+' h '+(m%60)+'m';return Math.floor(h/24)+' g '+(h%24)+' h'}
function fmtDT(t){if(!t)return '—';var d=new Date(t);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function openStorico(){
  if(!DB){toast('Database non collegato');return}
  var M=modal({title:'📋 Storico officina',wide:true,html:'<div class="frm2" style="grid-template-columns:1fr 1fr 1.2fr"><label><div class="lab">Dal</div><input class="field" type="date" id="sf" value="'+isoD(Date.now()-6*864e5)+'"></label><label><div class="lab">Al</div><input class="field" type="date" id="st2" value="'+isoD(Date.now())+'"></label><label><div class="lab">Vettura / posto / etichetta</div><input class="field" id="sq" placeholder="es. 3009, C2, Carrozzeria" autocomplete="off"></label></div><div class="sub" id="ssum" style="margin:12px 0 6px">Carico…</div><div class="sto" id="stab"></div>',
    foot:[{label:'⬇ Esporta CSV',keep:true,fn:function(){csv()}},{label:'Chiudi',cls:'pri'}]});
  var ALL=[],rows=[];
  DB.ref('depotrack_officina_storico').once('value').then(function(sn){var o=sn.val()||{};ALL=Object.keys(o).map(function(k){var r=o[k];r.k=k;return r}).filter(function(r){return r&&r.in});draw()}).catch(function(e){$('#ssum',M.el).textContent='⚠ Non riesco a leggere lo storico: '+(e&&e.message||e)});
  function draw(){
    var f=parseD($('#sf',M.el).value),t=parseD($('#st2',M.el).value),q=$('#sq',M.el).value.trim().toLowerCase();
    if(f==null)f=0;t=(t==null?Date.now():t)+864e5;
    rows=ALL.filter(function(r){var inR=(r.in>=f&&r.in<t)||(r.out&&r.out>=f&&r.out<t)||(!r.out&&r.in<t);if(!inR)return false;return !q||[r.n,r.posto,r.lab,r.model,r.by,r.outBy].join(' ').toLowerCase().indexOf(q)>-1}).sort(function(a,b){return b.in-a.in});
    var nin=rows.filter(function(r){return r.in>=f&&r.in<t}).length,nout=rows.filter(function(r){return r.out&&r.out>=f&&r.out<t}).length,dd=rows.filter(function(r){return r.out}),avg=dd.length?dd.reduce(function(a,r){return a+(r.out-r.in)},0)/dd.length:null;
    $('#ssum',M.el).innerHTML='<b style="color:var(--txt)">'+nin+'</b> entrate · <b style="color:var(--txt)">'+nout+'</b> uscite · permanenza media <b style="color:var(--txt)">'+(avg==null?'—':durShort(avg))+'</b> · '+rows.filter(function(r){return !r.out}).length+' ancora dentro';
    $('#stab',M.el).innerHTML=rows.length?'<table><thead><tr><th>Vettura</th><th>Posto</th><th>Etichetta</th><th>Entrata</th><th>Uscita</th><th>Durata</th><th>Chi</th></tr></thead><tbody>'+rows.map(function(r){return '<tr><td><b>'+esc(r.n)+'</b><small>'+esc(r.model||'')+'</small></td><td>'+esc(r.posto||'')+'</td><td>'+esc(r.lab||'—')+'</td><td>'+fmtDT(r.in)+'</td><td>'+(r.out?fmtDT(r.out):'<span class="dentro">in officina</span>')+'</td><td>'+durShort((r.out||Date.now())-r.in)+'</td><td>'+esc(r.by||'—')+(r.outBy&&r.outBy!==r.by?' → '+esc(r.outBy):'')+'</td></tr>'}).join('')+'</tbody></table>':'<p class="sub" style="padding:10px">Nessun passaggio in officina nel periodo.</p>';
  }
  function csv(){
    if(!rows.length){toast('Niente da esportare');return}
    var c=function(x){x=String(x==null?'':x);return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
    var lines=['Vettura;Modello;Posto;Etichetta;Entrata;Uscita;Durata (min);Inserita da;Tolta da;Stato in uscita'].concat(rows.map(function(r){var fy=function(t){return new Date(t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};return [r.n,r.model,r.posto,r.lab,fy(r.in),r.out?fy(r.out):'in officina',Math.round(((r.out||Date.now())-r.in)/60000),r.by,r.outBy,r.statoOut].map(c).join(';')}));
    var blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=DOCX.createElement('a');
    a.href=URL.createObjectURL(blob);a.download='storico_officina_'+$('#sf',M.el).value+'_'+$('#st2',M.el).value+'.csv';DOCX.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
  }
  ['#sf','#st2'].forEach(function(id){$(id,M.el).onchange=draw});$('#sq',M.el).oninput=draw;
}
function openCfg(){
  if(!su()){toast('Solo il superuser modifica blocchi ed etichette');return}
  var M=modal({title:'⚙ Blocchi ed etichette',html:'<div class="frm"><div class="sub">Nome dei blocchi (es. l\'ente che li usa)</div>'
    +OBLK.map(function(bk){return '<input class="field" id="ob'+bk.k+'" value="'+esc(blkName(bk.k))+'" placeholder="'+bk.def+' ('+bk.n+' postazioni da 2 posti)">'}).join('')
    +'<div class="sub">Allarme tempo in officina (ore)</div><div class="frm2"><label><div class="lab">🟡 Giallo dopo</div><input class="field" type="number" min="1" step="1" id="sw" value="'+sogl().w+'"></label><label><div class="lab">🔴 Rosso dopo</div><input class="field" type="number" min="2" step="1" id="sb" value="'+sogl().b+'"></label></div>'
    +'<div class="sub">Etichette del menu a tendina, una per riga</div><textarea class="field" id="oeti" rows="9">'+esc(etiList().join('\n'))+'</textarea></div>',
    foot:[{label:'Annulla'},{label:'Salva',cls:'pri',keep:true,fn:function(){
      if(!canEdit())return;
      var up={};OBLK.forEach(function(bk){up['blocchi/'+bk.k+'/nome']=$('#ob'+bk.k,M.el).value.trim()||null});
      var seen={},list=$('#oeti',M.el).value.split('\n').map(function(s){return s.trim()}).filter(function(s){if(!s||seen[s.toLowerCase()])return false;seen[s.toLowerCase()]=1;return true});
      up.etichette=list.length?list:null;
      var sw=+$('#sw',M.el).value,sb=+$('#sb',M.el).value;if(!(sw>0)||!(sb>sw)){toast('⚠ Soglie non valide: il rosso deve essere dopo il giallo');return}
      up['soglie/warn']=sw;up['soglie/bad']=sb;
      DB.ref('depotrack_officina').update(up).then(function(){toast('Salvato');M.close()}).catch(werr);
    }}]});
}
function openFermi(){
  var tot=V.length,cnt={};V.forEach(function(v){if(isFerma(v.s))cnt[v.s]=(cnt[v.s]||0)+1});
  var fl=sortedV().filter(function(v){return isFerma(v.s)}),max=1;Object.keys(cnt).forEach(function(k){max=Math.max(max,cnt[k])});
  var bars=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]}).map(function(k){return '<div class="fbar" style="--c:'+stOf(k)[1]+'"><span>'+esc(stOf(k)[0])+'</span><i style="width:'+(cnt[k]/max*100)+'%"></i><b>'+cnt[k]+'</b></div>'}).join('');
  var rows=fl.map(function(v){var p=offOf(v.id);return '<div class="r" style="--c:'+stOf(v.s)[1]+'"><b>'+esc(v.n)+'</b><em>'+esc(stOf(v.s)[0])+(v.note?' · '+esc(v.note):'')+'</em><span>'+(p?'🔧 '+pname(p):(v.stall?esc(shortSid(v.stall)):'—'))+'</span></div>'}).join('');
  modal({title:'🚨 Fermi: '+fl.length+' su '+tot+' ('+(tot?Math.round(fl.length/tot*100):0)+'%)',wide:true,html:(bars||'<p class="sub">Nessun mezzo fermo.</p>')+(rows?'<div class="list">'+rows+'</div>':'')});
}
function openRentri(){
  var ed=su(),rs=rentriSt(),r=RENTRI||{};
  var hist=arr(r.storico).sort(function(a,b){return b.ts-a.ts}).slice(0,8);
  var col={'r-ok':'var(--ok)','r-warn':'var(--warn)','r-bad':'var(--bad)'}[rs.cls];
  var html='<div class="rbig" style="--c:'+col+'">♻ '+esc(rs.t)+(r.next?' · '+fmtD(r.next):'')+'</div>'
    +'<dl class="det"><dt>Ultimo controllo</dt><dd>'+(r.last?fmtD(r.last)+(r.by?' · '+esc(r.by):''):'mai registrato')+'</dd><dt>Prossima scadenza</dt><dd>'+(r.next?fmtD(r.next):'—')+'</dd></dl>'
    +(ed?'<div class="frm" style="margin-top:16px"><div class="frm2"><label><div class="lab">Data controllo</div><input class="field" type="date" id="rl" value="'+isoD(Date.now())+'"></label><label><div class="lab">Prossima scadenza</div><input class="field" type="date" id="rn" value="'+isoD(Date.now()+7*864e5)+'"></label></div><div class="sub">La scadenza si propone a +7 giorni dal controllo: cambiala se serve. Il riquadro diventa giallo 2 giorni prima e rosso il giorno della scadenza.</div></div>':'')
    +(hist.length?'<div class="sub" style="margin-top:14px">Storico</div><div class="hist">'+hist.map(function(h){return '<div><span>'+fmtD(h.ts)+'</span><span>'+esc(h.by||'')+'</span></div>'}).join('')+'</div>':'');
  var M=modal({title:'♻ RENTRI',html:html,foot:ed?[{label:'Solo scadenza',keep:true,fn:function(){
      var n=parseD($('#rn',M.el).value);if(!n){toast('⚠ Data scadenza non valida');return}
      DB.ref('depotrack_rentri/next').set(n).then(function(){toast('Scadenza RENTRI aggiornata');M.close()}).catch(werr)}},
    {label:'✅ Registra controllo',cls:'pri',keep:true,fn:function(){
      var l=parseD($('#rl',M.el).value),n=parseD($('#rn',M.el).value);if(!l||!n){toast('⚠ Date non valide');return}
      if(day0(l)===day0(Date.now()))l=Date.now();
      if(n<=day0(l)){toast('⚠ La scadenza deve essere dopo il controllo');return}
      var up={last:l,by:ME.name||'',next:n};up['storico/'+nk('r')]={ts:l,by:ME.name||'',next:n};
      DB.ref('depotrack_rentri').update(up).then(function(){toast('Controllo RENTRI registrato');M.close()}).catch(werr);
      addLog('rentri','Controllo RENTRI registrato, prossima scadenza '+fmtD(n));
    }}]:[]});
  var rl=$('#rl',M.el);if(rl)rl.onchange=function(){var l=parseD(rl.value);if(l)$('#rn',M.el).value=isoD(l+7*864e5)};
}

/* ---------- accesso (stessi utenti di Aurora) ---------- */
function openLogin(){
  if(!AUTH){toast('Accesso non disponibile');return}
  var M=modal({title:'Accedi a DepoTrack',html:'<div class="frm"><div><div class="lab">Email</div><input class="field" id="le" type="email" autocomplete="username"></div><div><div class="lab">Password</div><input class="field" id="lp" type="password" autocomplete="current-password"></div><div class="err" id="lerr"></div></div>',
    foot:[{label:'Annulla'},{label:'Accedi',cls:'pri',keep:true,fn:go}]});
  function go(){
    var e=$('#le',M.el).value.trim(),p=$('#lp',M.el).value,er=$('#lerr',M.el);er.textContent='';
    if(!e||!p){er.textContent='Inserisci email e password.';return}
    AUTH.signInWithEmailAndPassword(e,p).then(function(){M.close()}).catch(function(err){
      var map={'auth/invalid-email':'Email non valida.','auth/user-not-found':'Utente non trovato.','auth/wrong-password':'Password errata.','auth/invalid-credential':'Email o password errati.','auth/too-many-requests':'Troppi tentativi, riprova tra qualche minuto.'};
      er.textContent=map[err.code]||('Errore: '+err.message);
    });
  }
  $('#lp',M.el).onkeydown=function(ev){if(ev.key==='Enter')go()};
  setTimeout(function(){$('#le',M.el).focus()},60);
}
function onAuth(user){
  if(!user){var was=!!ME.uid;ME={uid:null,name:'',role:null};paintUser();render();if(was)toast('Disconnesso');return}
  DB.ref('depotrack_user/'+user.uid).once('value').then(function(s){
    var u=s.val();if(!u||!u.ruolo){toast('Utente non abilitato');AUTH.signOut();return}
    ME={uid:user.uid,name:u.nome||user.email,role:String(u.ruolo).trim().toLowerCase()};
    resetInact();paintUser();render();toast('Ciao '+ME.name+' · '+ME.role);
  }).catch(function(err){toast('Errore verifica utente: '+err.message);AUTH.signOut()});
}
/* stessa regola di Aurora: 20 minuti senza toccare niente = logout (la dashboard resta visibile) */
var inact=null;
function resetInact(){if(inact){clearTimeout(inact);inact=null}if(!ME.uid)return;inact=setTimeout(function(){if(ME.uid){toast('Sessione scaduta per inattività');AUTH.signOut()}},20*60*1000)}
function watchActivity(doc){['mousedown','keydown','touchstart','click'].forEach(function(ev){doc.addEventListener(ev,resetInact,{passive:true})})}
watchActivity(document);

/* ---------- primo piano: finestra sempre sopra le altre (Chrome / Chromium / Edge) ---------- */
var PIP=null;
function pinToggle(){
  if(PIP){PIP.close();return}
  if(!('documentPictureInPicture' in window)){
    modal({title:'📌 Primo piano non disponibile',html:'<div class="sub">Questo browser non permette di tenere una finestra sopra le altre. Serve <b>Chrome, Chromium o Edge</b> aggiornati (versione 116 o successiva).<br><br>In alternativa la dashboard resta comunque una finestra a parte: spostala sul secondo monitor o affiancala ad Aurora.</div>'});
    return;
  }
  var app=document.getElementById('app'),w=Math.min(Math.max(app.offsetWidth,760),1400),h=Math.min(Math.max(Math.round(w*0.56),460),900);
  documentPictureInPicture.requestWindow({width:w,height:h}).then(function(pw){
    PIP=pw;
    [].slice.call(document.styleSheets).forEach(function(ss){
      try{var css=[].slice.call(ss.cssRules).map(function(r){return r.cssText}).join('\n');var st=pw.document.createElement('style');st.textContent=css;pw.document.head.appendChild(st)}
      catch(e){if(ss.href){var l=pw.document.createElement('link');l.rel='stylesheet';l.href=ss.href;pw.document.head.appendChild(l)}}
    });
    pw.document.title='Officina · DepoTrack';
    pw.document.body.appendChild(app);pw.document.body.appendChild(document.getElementById('toast'));
    DOCX=pw.document;watchActivity(pw.document);pw.addEventListener('resize',fitSoon);
    var ph=document.createElement('div');ph.className='ph';ph.id='ph';ph.innerHTML='<div style="font-size:42px">📌</div><div><b style="color:var(--txt)">La dashboard è in primo piano</b><br>Chiudi la finestrella o premi il tasto qui sotto per riportarla qui.</div><button class="btn pri" id="bBack">Riporta qui</button>';
    document.body.appendChild(ph);document.getElementById('bBack').onclick=function(){if(PIP)PIP.close()};
    $('#bPin').classList.add('on');
    pw.addEventListener('pagehide',function(){
      var a=pw.document.getElementById('app'),t=pw.document.getElementById('toast');
      [].slice.call(pw.document.querySelectorAll('.scrim')).forEach(function(s){s.remove()});
      var p=document.getElementById('ph');if(p)p.remove();
      if(a)document.body.appendChild(a);if(t)document.body.appendChild(t);
      DOCX=document;PIP=null;var b=document.getElementById('bPin');if(b)b.classList.remove('on');render();
    });
    render();
  }).catch(function(e){toast('⚠ Primo piano non riuscito: '+(e&&e.message||e))});
}

/* ---------- avvio ---------- */
document.getElementById('bPin').onclick=pinToggle;
window.addEventListener('resize',fitSoon);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
document.getElementById('bCfg').onclick=function(){openCfg()};
document.getElementById('bSto').onclick=function(){openStorico()};
paintUser();tick();setInterval(tick,1000);setInterval(render,60000);render();
if(typeof firebase==='undefined'){setStatus('err');toast('Firebase non raggiungibile (sei offline?)')}
else{
  try{firebase.initializeApp(CFG);DB=firebase.database()}catch(e){setStatus('err')}
  try{AUTH=firebase.auth();AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(function(){})}catch(e){AUTH=null}
  if(DB){
    setStatus('conn');var first=true;
    DB.ref('depotrack').on('value',function(s){var d=s.val()||{};ingest(d);LIVE=true;setStatus('live');render();if(first){first=false;if(AUTH)AUTH.onAuthStateChanged(onAuth)}},function(){setStatus('err');toast('Accesso al database negato')});
    DB.ref('depotrack_officina').on('value',function(s){offIngest(s.val());render()},function(){});
    DB.ref('depotrack_rentri').on('value',function(s){RENTRI=s.val()||{};render()},function(){});
    DB.ref('depotrack_log').orderByKey().limitToLast(400).on('value',function(s){
      var o=s.val()||{},t0=day0(Date.now());
      TODAY=Object.keys(o).map(function(k){return o[k]}).filter(function(e){return e&&e.type==='officina'&&e.ts>=t0}).sort(function(a,b){return b.ts-a.ts});
      renderToday();
    },function(){});
    DB.ref('.info/connected').on('value',function(s){if(LIVE)setStatus(s.val()?'live':'off')});
  }
}
})();
