<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabellone Carrozzeria SD</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B2545;--bg2:#13315C;--card:#ffffff;--ink:#14213d;--mut:#6b7280;--acc:#F28705;--acc2:#035AA6;--line:#e5e7eb;--hi:#FFFFFF;
--alta:#fde2e1;--altaT:#9f1239;--media:#ffedd5;--mediaT:#9a3412;--bassa:#dcfce7;--bassaT:#166534;--mol:#dbeafe;--molT:#1e40af;--urg:#7f1d1d}
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);background-image:var(--pattern,none);background-size:120px 120px;background-attachment:fixed}
header{position:sticky;top:0;z-index:20;background:var(--bg2);color:var(--hi);padding:10px 14px calc(8px) 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);border-bottom:3px solid var(--acc)}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:17px;margin:0;letter-spacing:.3px}
h1 small{display:block;font-size:11px;opacity:.75;font-weight:normal;margin-top:2px}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:bold;cursor:pointer;background:var(--acc);color:#111;white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--hi)}
.btn.sec{background:#eef2f7;color:var(--ink)}
.btn.red{background:#dc2626;color:#fff}
.btn.green{background:#16a34a;color:#fff}
.btn:active{transform:scale(.97)}
.stats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:5px 10px;text-align:center;cursor:pointer;min-width:74px}
.st b{display:block;font-size:19px;color:var(--acc)}
.st span{font-size:10.5px;opacity:.9}
.st.on{background:var(--acc);color:#111}.st.on b{color:#111}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hi);font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.tab.on{background:var(--hi);color:var(--bg2);font-weight:bold}
main{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;background:rgba(255,255,255,.95);padding:10px;border-radius:12px}
.filters input[type=search]{flex:1 1 260px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.filters select{flex:1 1 30%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;flex:0 0 auto;white-space:nowrap}
.chk input{width:18px;height:18px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px 12px 10px;box-shadow:0 3px 10px rgba(0,0,0,.18);border-left:6px solid var(--acc2);position:relative;cursor:pointer}
.card.closed{opacity:.55}
.card.closed .num{text-decoration:line-through}
.ctop{display:flex;align-items:center;gap:8px}
.num{font-size:26px;font-weight:bold;letter-spacing:1px}
.badge{font-size:11px;font-weight:bold;padding:3px 7px;border-radius:6px;white-space:nowrap}
.bF{background:#dc2626;color:#fff}
.bS{background:#facc15;color:#111}
.days{margin-left:auto;text-align:right;font-size:11px;color:var(--mut)}
.days b{display:block;font-size:20px;color:var(--ink)}
.days.hot b{color:#dc2626}
.line{font-size:13.5px;margin:6px 0 0;line-height:1.35}
.line .k{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef2f7;color:#334155;font-weight:bold}
.p-ALTA{background:var(--alta);color:var(--altaT)}.p-MEDIA{background:var(--media);color:var(--mediaT)}.p-BASSA{background:var(--bassa);color:var(--bassaT)}.p-MOL{background:var(--mol);color:var(--molT)}
.pc1{background:var(--urg);color:#fff}.pc2{background:#dc2626;color:#fff}.pc3{background:#f59e0b;color:#111}.pc4{background:#22c55e;color:#062}
.qa{display:flex;gap:6px;margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.qa button{flex:1;font-size:12px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:#f8fafc;cursor:pointer;color:var(--ink)}
.empty{color:#fff;text-align:center;padding:40px 10px;opacity:.85}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;font-size:30px;line-height:58px;padding:0;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mut)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
label.f{min-width:0;display:flex;flex-direction:column;font-size:11.5px;color:var(--mut);gap:4px;text-transform:uppercase;letter-spacing:.3px}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;font-size:15px;padding:9px 10px;border:1px solid #d1d5db;border-radius:9px;font-family:inherit;color:var(--ink);background:#fff;text-transform:none;letter-spacing:0}
label.f textarea{min-height:64px;resize:vertical}
.sugg{font-size:13px;padding:8px 10px;border-radius:9px;background:#f1f5f9}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.sec-t{font-size:13px;font-weight:bold;margin:14px 0 6px;color:var(--bg2);border-left:4px solid var(--acc);padding-left:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:2px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;background:#f8fafc}
.pal button.on{border-color:var(--ink)}
.sw{display:inline-flex}.sw i{width:12px;height:18px;display:block}
.printarea{display:none}

.sheet .vbtn button{color:var(--ink);background:#eef2f7}.sheet .vbtn button.on{background:var(--acc);color:#111}
.ic{width:1.05em;height:1.05em;vertical-align:-.17em;flex:0 0 auto;stroke-width:1.9}
.btn .ic,.qa button .ic,.tab .ic,.vbtn .ic{margin-right:5px}
.vbtn button .ic{margin-right:0}.vbtn button span{margin-left:5px}
.qa button{display:inline-flex;align-items:center;justify-content:center;gap:5px}.qa button .ic{margin:0}
.chip .ic{width:.95em;height:.95em;margin-right:3px}
.sheet h2 .x .ic{width:22px;height:22px}
h1 .ic.logo{width:22px;height:22px;margin-right:6px;vertical-align:-4px;color:var(--acc)}
body.glass h1 .ic.logo{color:var(--g1);filter:drop-shadow(0 0 6px rgba(var(--g1rgb),.7))}
.srch{position:relative;flex:1 1 260px;display:flex}.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8b93a5;pointer-events:none}
.filters .srch input[type=search]{flex:1;padding-left:34px!important}
body.glass .tab .ic{opacity:.85}body.glass .tab.on .ic{color:#67e8f9;opacity:1}
body.glass .qa button .ic{color:#67e8f9}
body.glass .btn:not(.ghost):not(.sec):not(.red) .ic{color:#fff}
.bS .ic{width:.95em;height:.95em;margin-right:2px}
/* ================= STILE LIQUID GLASS ================= */
body.glass{--g1:#22d3ee;--g2:#a855f7;--g1rgb:34,211,238;--g2rgb:168,85,247;--gbase:#14161b;--gbg:rgba(255,255,255,.055);--gbd:rgba(160,210,255,.18);--gtx:#e8ecf4;--gmut:#9aa3b5;
 font-family:'Inter',system-ui,Arial,sans-serif;color:var(--gtx);background:var(--gbase);
 background-image:radial-gradient(600px 420px at 8% 12%,rgba(var(--g1rgb),.16),transparent 70%),radial-gradient(700px 500px at 92% 20%,rgba(var(--g2rgb),.16),transparent 70%),radial-gradient(600px 500px at 60% 100%,rgba(249,115,22,.10),transparent 70%),var(--pattern,none);
 background-size:auto,auto,auto,120px 120px;background-attachment:fixed}
body.glass .gl,body.glass header,body.glass .filters,body.glass .card,body.glass .sheet,body.glass .xwrap,body.glass .toast,body.glass .ro{
 background:var(--gbg);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
 border:1px solid var(--gbd);box-shadow:0 0 0 1px rgba(var(--g2rgb),.08),0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
body.glass header{background:rgba(22,25,32,.72);border-width:0 0 1px 0;border-bottom:1px solid var(--gbd);box-shadow:0 8px 30px rgba(0,0,0,.4)}
body.glass header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2));opacity:.8}
body.glass h1{font-weight:700;letter-spacing:.2px}
body.glass .st{background:rgba(255,255,255,.05);border:1px solid var(--gbd);border-radius:14px}
body.glass .st b{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
body.glass .st.on{background:linear-gradient(135deg,rgba(var(--g1rgb),.25),rgba(var(--g2rgb),.25));box-shadow:0 0 18px rgba(var(--g1rgb),.25);color:#fff}
body.glass .st.on b{color:#fff;-webkit-text-fill-color:#fff}
body.glass .tabs{background:rgba(255,255,255,.04);border:1px solid var(--gbd);border-radius:14px;padding:4px;width:max-content;max-width:100%}
body.glass .tab{background:transparent;border:1px solid transparent;color:var(--gmut);border-radius:10px}
body.glass .tab.on{background:rgba(var(--g1rgb),.10);color:#fff;border:1px solid rgba(var(--g1rgb),.55);box-shadow:0 0 14px rgba(var(--g1rgb),.25),inset 0 0 10px rgba(var(--g2rgb),.15);font-weight:600}
body.glass .btn{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;box-shadow:0 0 18px rgba(var(--g1rgb),.35),0 0 26px rgba(var(--g2rgb),.25);border:1px solid rgba(255,255,255,.25)}
body.glass .btn.ghost,body.glass .btn.sec{background:rgba(255,255,255,.07);color:var(--gtx);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border:1px solid var(--gbd)}
body.glass .btn.red{background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(239,68,68,.5);box-shadow:0 0 14px rgba(239,68,68,.2)}
body.glass .btn.green{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff}
body.glass .fab{border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.04) 60%),rgba(30,34,44,.7);border:1px solid rgba(var(--g1rgb),.6);color:var(--g1);box-shadow:0 0 22px rgba(var(--g1rgb),.45),0 0 40px rgba(var(--g2rgb),.25);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.glass .vbtn{border:1px solid var(--gbd);background:rgba(255,255,255,.04);border-radius:12px;padding:3px;gap:2px}
body.glass .vbtn button{background:transparent;color:var(--gmut);border-radius:9px}
body.glass .vbtn button.on{background:rgba(var(--g1rgb),.12);color:#fff;box-shadow:inset 0 0 0 1px rgba(var(--g1rgb),.55),0 0 12px rgba(var(--g1rgb),.25)}
body.glass .filters{border-radius:16px}
body.glass .filters input[type=search],body.glass .filters select,body.glass label.f input,body.glass label.f select,body.glass label.f textarea,body.glass table.xl select{
 background:rgba(10,12,18,.45);color:var(--gtx);border:1px solid rgba(var(--g1rgb),.28);border-radius:11px;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
body.glass .filters input[type=search]:focus,body.glass .filters select:focus,body.glass label.f input:focus,body.glass label.f select:focus,body.glass label.f textarea:focus{outline:none;border-color:var(--g2);box-shadow:0 0 0 3px rgba(var(--g2rgb),.18),0 0 14px rgba(var(--g1rgb),.25)}
body.glass select option{background:#1d2028;color:#e8ecf4}
body.glass input::placeholder,body.glass textarea::placeholder{color:#6b7385}
body.glass .chk{color:var(--gtx)}
/* checkbox → switch */
body.glass .chk input[type=checkbox]{-webkit-appearance:none;appearance:none;width:40px;height:22px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--gbd);position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
body.glass .chk input[type=checkbox]::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#7b8394;transition:.2s}
body.glass .chk input[type=checkbox]:checked{background:linear-gradient(90deg,rgba(var(--g1rgb),.5),rgba(var(--g2rgb),.5));border-color:rgba(var(--g1rgb),.7);box-shadow:0 0 12px rgba(var(--g1rgb),.4)}
body.glass .chk input[type=checkbox]:checked::after{left:20px;background:#fff;box-shadow:0 0 8px #fff}
body.glass .card{border-radius:18px;border-left-width:1px;color:var(--gtx);transition:transform .15s,box-shadow .15s;overflow:hidden}
body.glass .card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc,var(--g1));box-shadow:0 0 14px var(--pc,var(--g1))}
body.glass .card::after{content:'';position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.07),transparent 40%);pointer-events:none}
body.glass .card:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(var(--g1rgb),.35),0 0 22px rgba(var(--g1rgb),.18),0 14px 34px rgba(0,0,0,.5)}
body.glass .num{color:#fff}
body.glass .days{color:var(--gmut)}body.glass .days b{color:#fff}body.glass .days.hot b{color:#fb7185;text-shadow:0 0 10px rgba(251,113,133,.6)}
body.glass .line{color:#cfd5e1}body.glass .line .k{color:var(--gmut)}
body.glass .chip{background:rgba(255,255,255,.07);color:#cfd5e1;border:1px solid rgba(255,255,255,.1)}
body.glass .p-ALTA{background:rgba(244,63,94,.16);color:#fda4af;border-color:rgba(244,63,94,.45)}
body.glass .p-MEDIA{background:rgba(251,146,60,.16);color:#fdba74;border-color:rgba(251,146,60,.45)}
body.glass .p-BASSA{background:rgba(34,197,94,.14);color:#86efac;border-color:rgba(34,197,94,.4)}
body.glass .p-MOL{background:rgba(var(--g1rgb),.14);color:var(--g1);border-color:rgba(var(--g1rgb),.45)}
body.glass .pc1{background:linear-gradient(90deg,#be123c,#f43f5e);color:#fff;box-shadow:0 0 12px rgba(244,63,94,.5);border:0}
body.glass .pc2{background:linear-gradient(90deg,#f97316,#fb923c);color:#fff;box-shadow:0 0 10px rgba(249,115,22,.4);border:0}
body.glass .pc3{background:linear-gradient(90deg,#eab308,#facc15);color:#1a1a1a;border:0}
body.glass .pc4{background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff;border:0}
body.glass .bF{background:rgba(239,68,68,.2);color:#fecaca;border:1px solid rgba(239,68,68,.6);box-shadow:0 0 10px rgba(239,68,68,.35)}
body.glass .bS{background:rgba(250,204,21,.18);color:#fde68a;border:1px solid rgba(250,204,21,.5)}
body.glass .qa{border-top:1px solid rgba(255,255,255,.08)}
body.glass .qa button{background:rgba(255,255,255,.05);color:var(--gtx);border:1px solid var(--gbd);border-radius:10px}
body.glass .qa button:hover{border-color:rgba(var(--g1rgb),.6);box-shadow:0 0 10px rgba(var(--g1rgb),.25)}
body.glass .modal{background:rgba(5,7,12,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
body.glass .sheet{background:rgba(26,29,38,.82);color:var(--gtx);border:1px solid rgba(var(--g1rgb),.35);box-shadow:0 0 0 1px rgba(var(--g2rgb),.25),0 0 40px rgba(var(--g1rgb),.12),0 20px 50px rgba(0,0,0,.6)}
body.glass .sheet h2 .x{color:var(--gmut)}
body.glass label.f{color:var(--gmut)}
body.glass .sugg{background:rgba(var(--g1rgb),.08);border:1px solid rgba(var(--g1rgb),.25);color:#e6f6fb}
body.glass .sec-t{color:#fff;border-left:0;padding-left:0;display:flex;align-items:center;gap:8px}
body.glass .sec-t::before{content:'';width:18px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--g1),var(--g2));box-shadow:0 0 8px var(--g1)}
body.glass .log{border-color:var(--gbd);background:rgba(0,0,0,.2)}body.glass .log div{border-bottom-color:rgba(255,255,255,.06)}
body.glass .pal button{background:rgba(255,255,255,.05);color:var(--gtx);border-color:transparent}body.glass .pal button.on{border-color:var(--g1)}
body.glass .toast{background:rgba(26,29,38,.9);color:#fff;border:1px solid rgba(var(--g1rgb),.5);box-shadow:0 0 0 1px rgba(var(--g2rgb),.3),0 0 20px rgba(var(--g1rgb),.25);border-radius:14px;padding:11px 16px 11px 42px}
body.glass .toast::before{content:'✓';position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;border:2px solid var(--g1);color:var(--g1);font-size:12px;font-weight:bold;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px var(--g1)}
body.glass .ro{color:#fde68a;border-color:rgba(250,204,21,.4);background:rgba(250,204,21,.08);border-radius:14px}
body.glass .empty{color:var(--gmut)}
body.glass .err{color:#fda4af}
/* tabella in vetro */
body.glass .xwrap{border-radius:16px;background:rgba(20,23,30,.6)}
body.glass table.xl th{background:rgba(30,34,46,.92);color:#e8ecf4;border:0;border-bottom:1px solid rgba(var(--g1rgb),.45);border-right:1px solid rgba(255,255,255,.06);font-weight:600}
body.glass table.xl td{background:rgba(255,255,255,.015);color:#dde3ee;border:0;border-bottom:1px solid rgba(255,255,255,.06);border-right:1px solid rgba(255,255,255,.04)}
body.glass table.xl td.v{background:rgba(26,30,40,.95);color:#fff}
body.glass table.xl tbody tr:hover td{background:rgba(var(--g1rgb),.07)}
body.glass table.xl td.inp{background:rgba(250,204,21,.05)}
body.glass table.xl tbody tr:hover td.inp{background:rgba(250,204,21,.10)}
body.glass table.xl td.fF{color:#fb7185}
body.glass table.xl td.hot{color:#fb7185}
body.glass table.xl td.sA{background:rgba(244,63,94,.16);color:#fda4af}
body.glass table.xl td.sM{background:rgba(251,146,60,.14);color:#fdba74}
body.glass table.xl td.sB{background:rgba(34,197,94,.12);color:#86efac}
body.glass table.xl td.sMo{background:rgba(var(--g1rgb),.12);color:var(--g1)}
body.glass table.xl tr.cl td{color:#6b7385}
body.glass .hint{color:var(--gmut)!important}
body.glass{color-scheme:dark}
@media(max-width:700px){.vbtn button span{display:none}h1{font-size:15px}#bUser{max-width:110px;overflow:hidden;text-overflow:ellipsis}.hrow>div{gap:5px!important}.btn.ghost{padding:8px 9px}}
/* PC: barra laterale come NoteWise */
@media(min-width:1100px){
 body.glass header{position:fixed;top:14px;left:14px;bottom:14px;width:270px;border-radius:20px;border:1px solid var(--gbd);padding:18px 14px;display:flex;flex-direction:column;gap:6px;overflow:auto;background:rgba(28,31,40,.62)}
 body.glass header::after{display:none}
 body.glass header .hrow{flex-direction:column;align-items:stretch;gap:12px}
 body.glass header .hrow>div{flex-wrap:wrap}
 body.glass .stats{display:grid;grid-template-columns:1fr 1fr;overflow:visible;gap:8px;padding-top:14px}
 body.glass .st{min-width:0}
 body.glass .tabs{flex-direction:column;width:auto;overflow:visible;margin-top:14px;background:transparent;border:0;padding:0;gap:4px}
 body.glass .tabs::before{content:'Navigazione';font-size:11.5px;color:var(--gmut);text-transform:uppercase;letter-spacing:.6px;margin:0 0 4px 4px}
 body.glass .tab{text-align:left;padding:10px 12px;font-size:13.5px;position:relative}
 body.glass .tab.on{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12);box-shadow:none}
 body.glass .tab.on::before{content:'';position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(var(--g1),var(--g2));box-shadow:0 0 8px var(--g1)}
 body.glass main{margin-left:298px;max-width:none;padding:20px 22px 90px 8px}
 body.glass .xwrap{max-height:calc(100vh - 170px)}
}
main.wide{max-width:none}
.xwrap{background:#fff;border-radius:10px;overflow:auto;max-height:calc(100vh - 250px);box-shadow:0 3px 10px rgba(0,0,0,.18)}
table.xl{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:1500px;width:100%}
table.xl th{position:sticky;top:0;z-index:2;background:#1F3864;color:#fff;font-weight:bold;padding:7px 6px;border:1px solid #999;text-align:center;white-space:normal;line-height:1.2}
table.xl td{border:1px solid #c8c8c8;padding:5px 6px;vertical-align:middle;background:#fff;color:#111}
table.xl tbody tr:hover td{background:#eef4ff}
table.xl tr.cl td{color:#a6a6a6;text-decoration:line-through}
table.xl td.v{font-weight:bold;font-size:13.5px;text-align:center;position:sticky;left:0;z-index:1}
table.xl th.v{left:0;z-index:3}
table.xl td.c{text-align:center}
table.xl td.inp{background:#FFF2CC}
table.xl tbody tr:hover td.inp{background:#ffe8a3}
table.xl td.fF{color:#C00000;font-weight:bold;text-align:center}
table.xl td.hot{color:#C00000;font-weight:bold}
table.xl td.sA{background:#F8CBAD;color:#9C0006;font-weight:bold;text-align:center}
table.xl td.sM{background:#FCE4D6;text-align:center}
table.xl td.sB{background:#C6EFCE;text-align:center}
table.xl td.sMo{background:#DDEBF7;text-align:center}
table.xl select{font-size:12px;padding:3px;border:1px solid #d6b656;border-radius:4px;background:#fffbe9;max-width:150px;font-family:inherit}
table.xl tr{cursor:pointer}
.vbtn{display:flex;gap:0;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.25)}
.vbtn button{border:0;padding:8px 10px;background:rgba(255,255,255,.1);color:var(--hi);font-size:13px;cursor:pointer;font-weight:bold}
.vbtn button.on{background:var(--acc);color:#111}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:5px;vertical-align:middle}
.dot.live{background:#22c55e;box-shadow:0 0 6px #22c55e}.dot.off{background:#f59e0b}.dot.err{background:#ef4444}
.ro{background:#fef3c7;color:#78350f;border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px;display:none}
.err{color:#dc2626;font-size:13px;min-height:16px}
.log{font-size:12.5px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:9px;padding:6px 8px}
.log div{padding:3px 0;border-bottom:1px dashed #eee}

 header,main,.fab,.modal,.toast{display:none!important}

}

function uid(){return 'c_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(s){if(!s)return'';const[a,m,g]=s.split('-');return g+'/'+m+'/'+a}
function fmtTs(t){const d=new Date(t);return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function giorni(r){if(!r.data)return null;const t=new Date(today()+'T00:00:00'),d=new Date(r.data+'T00:00:00');return Math.round((t-d)/864e5)}
function isClosed(r){return r.azione===CLOSED}
function sugg(r){if(r.dove==='Molise')return'A MOLISE';if(!r.fermo)return'BASSA';const g=giorni(r);if(g===null||g>=21)return'ALTA';return g>=7?'MEDIA':'BASSA'}

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function clean(r){const o={};['vettura','fermo','stato','dove','danno','data','pratica','prioritaConc','azione','dataChiamata','rientro','referente','noteRiunione','noteLavagna','sollecitare','chiusaIl','prevAz'].forEach(k=>{o[k]=r[k]===undefined?'':r[k]});o.fermo=!!o.fermo;o.sollecitare=!!o.sollecitare;o.updated=Date.now();o.updatedBy=ME.name||'';return o}
function writeRow(r,what){
 if(!needEdit())return Promise.reject('ro');

 return DB.ref(ROOT+'/rows/'+r.id).set(o).then(()=>{log(r.vettura,what)}).catch(e=>{werr(e);throw e});
}
function log(vet,what){if(!DB)return;DB.ref(ROOT+'/log').push({ts:Date.now(),by:ME.name||'',vet:String(vet||''),what:String(what||'')}).catch(()=>{})}

function hexRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255]}
function mixDark(h,k){const [r,g,b]=hexRgb(h),f=x=>Math.round(x*k+20*(1-k));return 'rgb('+f(r)+','+f(g)+','+f(b)+')'}
function curPal(){return document.body.classList.contains('glass')?P.palG:P.palette}
function applyPalette(){
 document.body.classList.toggle('glass',P.style!=='classico');
 const glass=P.style!=='classico';
 const p=(PALETTES[glass?P.palG:P.palette]||PALETTES[glass?'glass':'navy']).c,r=document.documentElement.style;
 r.setProperty('--bg',p[0]);r.setProperty('--bg2',p[1]);r.setProperty('--acc',p[2]);r.setProperty('--acc2',p[3]);r.setProperty('--hi',p[4]);
 if(glass){
  const bs=document.body.style;
  bs.setProperty('--g1',p[2]);bs.setProperty('--g2',p[3]);bs.setProperty('--g1rgb',hexRgb(p[2]).join(','));bs.setProperty('--g2rgb',hexRgb(p[3]).join(','));
  bs.setProperty('--gbase',mixDark(p[0],.55));
 }
 if(P.pattern){
  const c=p[2];
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><g fill='none' stroke='${c}' stroke-opacity='.13' stroke-width='1.2'><circle cx='60' cy='60' r='44'/><circle cx='60' cy='60' r='30'/><circle cx='60' cy='60' r='14'/>${Array.from({length:12},(_,i)=>`<ellipse cx='60' cy='30' rx='7' ry='16' transform='rotate(${i*30} 60 60)'/>`).join('')}<circle cx='0' cy='0' r='16'/><circle cx='120' cy='0' r='16'/><circle cx='0' cy='120' r='16'/><circle cx='120' cy='120' r='16'/></g></svg>`;
  r.setProperty('--pattern',`url("data:image/svg+xml,${svg.replace(/#/g,'%23').replace(/</g,'%3C').replace(/>/g,'%3E')}")`);
 }else r.setProperty('--pattern','none');
}

function fillFilters(){
 const fd=document.getElementById('fDove'),fp=document.getElementById('fPrio');const vd=fd.value,vp=fp.value;
 fd.innerHTML='<option value="">Tutti i luoghi</option>'+S.lists.dove.map(x=>`<option>${esc(x)}</option>`).join('');
 fp.innerHTML='<option value="">Tutte le priorità</option><option value="__none">Non concordata</option>'+S.lists.priorita.map(x=>`<option>${esc(x)}</option>`).join('');
 fd.value=vd;fp.value=vp;
}
function filtered(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 const fd=document.getElementById('fDove').value,fp=document.getElementById('fPrio').value;
 const fF=document.getElementById('fF').checked,fS=document.getElementById('fS').checked;
 const tf=TABS.find(t=>t[0]===tab)[3];
 let rows=S.rows.filter(tf).filter(r=>{
  if(fd&&r.dove!==fd)return false;
  if(fp==='__none'&&r.prioritaConc)return false;
  if(fp&&fp!=='__none'&&r.prioritaConc!==fp)return false;
  if(fF&&!r.fermo)return false;
  if(fS&&!r.sollecitare)return false;
  if(statFilter==='F'&&!r.fermo)return false;
  if(statFilter==='ALTA'&&sugg(r)!=='ALTA')return false;
  if(statFilter==='30'&&!(r.fermo&&(giorni(r)??0)>=30))return false;
  if(statFilter==='SOL'&&!r.sollecitare)return false;
  if(q){const t=[r.vettura,r.stato,r.dove,r.danno,r.pratica,r.azione,r.noteRiunione,r.noteLavagna,r.referente,r.rientro].join(' ').toLowerCase();if(!t.includes(q))return false}
  return true;
 });
 const so=document.getElementById('fSort').value;
 rows.sort((a,b)=>{
  if(so==='vettura')return String(a.vettura).localeCompare(String(b.vettura),undefined,{numeric:true});
  if(so==='giorni')return (giorni(b)??-1)-(giorni(a)??-1);
  return prioN(a)-prioN(b)||(giorni(b)??999)-(giorni(a)??999);
 });
 return rows;
}

  const g=giorni(r),sg=sugg(r),pn=prioN(r),cl=isClosed(r);

   ${r.danno?`<div class="line"><span class="k">Danno</span><b>${esc(r.danno)}</b></div>`:''}
   <div class="line"><span class="k">Stato</span>${esc(r.stato)||'—'} · ${ic('map-pin')} ${esc(r.dove)||'—'}</div>
   ${r.pratica?`<div class="line"><span class="k">Aggiorn.</span>${esc(r.pratica)}</div>`:''}
   ${r.noteRiunione?`<div class="line"><span class="k">Riunione</span>${esc(r.noteRiunione)}</div>`:''}
   <div class="chips">
    ${r.prioritaConc?`<span class="chip pc${pn}">${esc(r.prioritaConc)}</span>`:'<span class="chip">Priorità da concordare</span>'}
    <span class="chip p-${sgc}">Sugg.: ${sg}</span>

    ${r.dataChiamata?`<span class="chip">${ic('calendar')}${fmt(r.dataChiamata)}</span>`:''}

    ${cl&&r.chiusaIl?`<span class="chip">Chiusa il ${fmt(r.chiusaIl)}</span>`:''}
   </div>

   ${ed?`<div class="qa" onclick="event.stopPropagation()">
    ${cl?`<button onclick="riapri('${r.id}')">${ic('rotate-ccw')}Riapri</button>`:`

    <button onclick="chiudi('${r.id}')">${ic('circle-check')}Rientrata</button>`}

function toISO(x){
 if(!x)return'';
 if(x instanceof Date)return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
 const m=String(x).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
 if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 return /^\d{4}-\d{2}-\d{2}/.test(x)?String(x).slice(0,10):'';
}
function importXlsx(inp){

  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const rows=[];
   ['Vetture','Storico'].concat(wb.SheetNames.slice(0,1)).filter((n,i,a)=>wb.Sheets[n]&&a.indexOf(n)===i).forEach(n=>{
    const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:''});
    const hi=aoa.findIndex(r=>r.some(c=>String(c).trim()==='Vettura'));if(hi<0)return;
    const H=aoa[hi].map(c=>String(c).trim());const get=(r,k)=>{const i=H.indexOf(k);return i<0?'':r[i]};
    for(const r of aoa.slice(hi+1)){const vet=String(get(r,'Vettura')).trim();if(!vet)continue;
     rows.push({vettura:vet,fermo:String(get(r,'Fermo (F)')).trim().toUpperCase()==='F',stato:String(get(r,'Stato attuale')),dove:String(get(r,'Dove si trova')),danno:String(get(r,'Lavorazione / danno')).trim(),data:toISO(get(r,'Data stato')),pratica:String(get(r,'Pratica')),prioritaConc:String(get(r,'Priorità concordata')),azione:String(get(r,'Azione concordata')),dataChiamata:toISO(get(r,'Data chiamata / spostamento')),rientro:String(get(r,'Rientro previsto')),referente:String(get(r,'Referente carrozzeria')),noteRiunione:String(get(r,'Note riunione')),noteLavagna:String(get(r,'Note lavagna')),sollecitare:String(get(r,'Da sollecitare')).toUpperCase()==='SI',chiusaIl:toISO(get(r,'Chiusa il')),prevAz:''})}
   });
   /* liste dei menu dal foglio "Liste" (colonne Dove si trova / Priorità / Azione) */
   let L=null;
   if(wb.Sheets['Liste']){
    const la=XLSX.utils.sheet_to_json(wb.Sheets['Liste'],{header:1,raw:false,defval:''});
    const hr=la.findIndex(r=>r.some(c=>/dove si trova/i.test(String(c))));
    if(hr>=0){const H=la[hr].map(c=>String(c).trim().toLowerCase());
     const col=n=>{const i=H.findIndex(h=>h.startsWith(n));return i<0?[]:la.slice(hr+1).map(r=>String(r[i]||'').trim()).filter(Boolean).filter((x,j,a)=>a.indexOf(x)===j)};
     const d=col('dove'),pr=col('priorit'),az=col('azion');
     if(d.length||pr.length||az.length){L={dove:d.length?d:S.lists.dove,priorita:pr.length?pr:S.lists.priorita,azione:az.length?az:S.lists.azione};if(!L.azione.includes(CLOSED))L.azione.push(CLOSED)}}
   }
   if(!rows.length&&!L){alert('Nessuna vettura trovata nel file.');return}
   const repl=rows.length?confirm('Trovate '+rows.length+' vetture nel file.\n\nOK = SOSTITUISCI tutto il tabellone su Firebase (vale per tutti)\nAnnulla = AGGIUNGI solo le vetture che non ci sono già'+(L?'\n\nI menu a scelta del foglio Liste vengono aggiornati in ogni caso.':'')):false;
   const have=new Set(S.rows.filter(r=>!isClosed(r)).map(r=>String(r.vettura)));
   const up={};let n=0;
   if(repl)S.rows.forEach(r=>{up['rows/'+r.id]=null});
   rows.forEach(r=>{if(repl||!have.has(r.vettura)){up['rows/'+uid()+Math.random().toString(36).slice(2,4)]=clean(r);n++}});
   if(L)up['lists']=L;
   DB.ref(ROOT).update(up).then(()=>{log('',(repl?'tabellone sostituito da Excel: ':'aggiunte da Excel: ')+n+' vetture'+(L?' + menu aggiornati':''));closeM('mTools');toast(n+' vetture importate'+(L?' · menu aggiornati':''))}).catch(werr);
  }catch(err){alert('Errore lettura file: '+err.message)}
 };
 rd.readAsArrayBuffer(f);
}

try{MYNAME=localStorage.getItem('tabCarrSD_nome')||''}catch(e){}
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
function paintUser(){const b=document.getElementById('bUser');b.innerHTML=UNLOCK?(ic('lock-open')+esc(MYNAME||'Blocca')):(ic('lock')+'Sblocca');ME.name=MYNAME}
function userBtn(){if(!UNLOCK){openLogin();return}lock('Tabellone bloccato')}
function lock(msg){if(AUTH&&AUTH.currentUser)AUTH.signOut();UNLOCK=false;paintUser();render();if(msg)toast(msg)}
function openLogin(){
 if(!AUTH){toast('Firebase non raggiungibile: controlla la connessione');return}
 document.getElementById('loginBody').innerHTML=`<h2>${ic('lock')} Sblocca il tabellone<button class="x" onclick="closeM('mLogin')">${ic('x')}</button></h2>
 <div class="fg"><label class="f full">Password<input id="lp" type="password" inputmode="numeric" autocomplete="off" onkeydown="if(event.key==='Enter')doLogin()"></label>
 <label class="f full">Il tuo nome (compare nel registro modifiche)<input id="ln" value="${esc(MYNAME)}" placeholder="es. Mauro"></label></div>
 <div class="err" id="lerr"></div>
 <div class="acts"><button class="btn sec" onclick="closeM('mLogin')">Annulla</button><button class="btn green" id="lgo" onclick="doLogin()">Sblocca</button></div>`;
 document.getElementById('mLogin').classList.add('on');setTimeout(()=>document.getElementById('lp').focus(),60);
}
async function doLogin(){
 const p=document.getElementById('lp').value.trim(),er=document.getElementById('lerr');er.textContent='';
 if(!p){er.textContent='Scrivi la password.';return}
 let h='';try{h=await sha('tabSD|'+p)}catch(e){er.textContent='Apri la pagina da https:// (GitHub Pages) per usare la password.';return}
 if(h!==PIN_HASH){er.textContent='Password errata.';document.getElementById('lp').value='';return}
 MYNAME=v('ln');try{localStorage.setItem('tabCarrSD_nome',MYNAME)}catch(e){}
 const pw='tabSD-'+p, btn=document.getElementById('lgo');btn.disabled=true;er.textContent='Sblocco in corso…';
 try{
  try{await AUTH.signInWithEmailAndPassword(TAB_EMAIL,pw)}
  catch(e1){
   if(e1.code==='auth/too-many-requests')throw e1;
   try{await AUTH.createUserWithEmailAndPassword(TAB_EMAIL,pw)}   // primo sblocco in assoluto: crea l'utente del tabellone
   catch(e2){throw e2.code==='auth/email-already-in-use'?e1:e2}
  }
  closeM('mLogin');
 }catch(err){
  btn.disabled=false;
  const map={'auth/too-many-requests':'Troppi tentativi, riprova tra qualche minuto.','auth/network-request-failed':'Niente rete, riprova.','auth/operation-not-allowed':'Su Firebase è disattivato l\'accesso con email e password.'};
  er.textContent=map[err.code]||('Errore Firebase: '+(err.code||err.message));
 }
}
function onAuth(user){
 const ok=!!(user&&user.email===TAB_EMAIL);
 if(user&&!ok){AUTH.signOut();return}
 const was=UNLOCK;UNLOCK=ok;paintUser();render();
 if(ok&&!was){resetInact();toast('Sbloccato'+(MYNAME?' · '+MYNAME:''))}
}
/* 20 minuti senza toccare niente = si blocca di nuovo */
let inact=null;
function resetInact(){if(inact){clearTimeout(inact);inact=null}if(!UNLOCK)return;inact=setTimeout(()=>{if(UNLOCK)lock('Bloccato per inattività')},20*60*1000)}
['mousedown','keydown','touchstart','click'].forEach(ev=>document.addEventListener(ev,resetInact,{passive:true}));

/* ---------- avvio ---------- */
hydrateIcons();applyPalette();cacheLoad();fillFilters();paintUser();render();resetInact();
setInterval(render,10*60*1000); // i giorni si aggiornano anche se la pagina resta aperta
if(typeof firebase==='undefined'){setStatus('err');toast('Firebase non raggiungibile: mostro l\'ultima copia salvata');LOADED=!!S.rows.length;render()}
else{
 try{firebase.initializeApp(CFG);DB=firebase.database()}catch(e){setStatus('err')}
 try{AUTH=firebase.auth();AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});AUTH.onAuthStateChanged(onAuth)}catch(e){AUTH=null}
 if(DB){
  setStatus('conn');
  DB.ref(ROOT+'/rows').on('value',s=>{const o=s.val()||{};S.rows=Object.keys(o).map(k=>({...o[k],id:k,vettura:String(o[k].vettura??'')}));LOADED=true;cacheSave();setStatus('live');render()},()=>{setStatus('err');toast('Accesso al database negato')});
  DB.ref(ROOT+'/lists').on('value',s=>{const l=s.val();if(l&&l.dove){S.lists={dove:l.dove||[],azione:l.azione||[],priorita:l.priorita||[]};cacheSave();fillFilters();render()}});
  DB.ref(ROOT+'/log').orderByKey().limitToLast(60).on('value',s=>{const o=s.val()||{};LOG=Object.keys(o).map(k=>o[k]).sort((a,b)=>b.ts-a.ts);const lb=document.getElementById('logBox');if(lb)lb.innerHTML=LOG.length?LOG.map(l=>`<div><b>${fmtTs(l.ts)}</b> · ${esc(l.by)} · ${l.vet?'<b>'+esc(l.vet)+'</b> ':''}${esc(l.what)}</div>`).join(''):'Nessuna modifica registrata.'});
  DB.ref('.info/connected').on('value',s=>{if(LOADED)setStatus(s.val()?'live':'off')});
 }
}
</script>
</body>
</html>
