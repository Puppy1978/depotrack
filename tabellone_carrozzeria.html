<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tabellone Carrozzeria SD</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B2545;--bg2:#13315C;--card:#ffffff;--ink:#14213d;--mut:#6b7280;--acc:#F28705;--acc2:#035AA6;--line:#e5e7eb;--hi:#FFFFFF;
--alta:#fde2e1;--altaT:#9f1239;--media:#ffedd5;--mediaT:#9a3412;--bassa:#dcfce7;--bassaT:#166534;--mol:#dbeafe;--molT:#1e40af;--urg:#7f1d1d}
*{box-sizing:border-box}
html,body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{min-height:100vh;background-color:var(--bg);background-image:var(--pattern,none);background-size:120px 120px;background-attachment:fixed}
header{position:sticky;top:0;z-index:20;background:var(--bg2);color:var(--hi);padding:10px 14px calc(8px) 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);border-bottom:3px solid var(--acc)}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
h1{font-size:17px;margin:0;letter-spacing:.3px}
h1 small{display:block;font-size:11px;opacity:.75;font-weight:normal;margin-top:2px}
.btn{border:0;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:bold;cursor:pointer;background:var(--acc);color:#111;white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.14);color:var(--hi)}
.btn.sec{background:#eef2f7;color:var(--ink)}
.btn.red{background:#dc2626;color:#fff}
.btn.green{background:#16a34a;color:#fff}
.btn:active{transform:scale(.97)}
.stats{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.st{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:5px 10px;text-align:center;cursor:pointer;min-width:74px}
.st b{display:block;font-size:19px;color:var(--acc)}
.st>.ic{display:none}
@media(min-width:1100px){body.vtab .st>.ic{display:block}}
.st span{font-size:10.5px;opacity:.9}
.st.on{background:var(--acc);color:#111}.st.on b{color:#111}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.tab{flex:0 0 auto;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--hi);font-size:13px;cursor:pointer;border:1px solid rgba(255,255,255,.15)}
.tab.on{background:var(--hi);color:var(--bg2);font-weight:bold}
main{max-width:1100px;margin:0 auto;padding:12px 12px 90px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;background:rgba(255,255,255,.95);padding:10px;border-radius:12px}
.filters input[type=search]{flex:1 1 260px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.filters select{flex:1 1 30%;min-width:0;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:#fff;color:var(--ink)}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;flex:0 0 auto;white-space:nowrap}
.chk input{width:18px;height:18px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px 12px 10px;box-shadow:0 3px 10px rgba(0,0,0,.18);border-left:6px solid var(--acc2);position:relative;cursor:pointer}
.card.closed{opacity:.55}
.card.closed .num{text-decoration:line-through}
.ctop{display:flex;align-items:center;gap:8px}
.num{font-size:26px;font-weight:bold;letter-spacing:1px}
.badge{font-size:11px;font-weight:bold;padding:3px 7px;border-radius:6px;white-space:nowrap}
.bF{background:#dc2626;color:#fff}
.bS{background:#facc15;color:#111}
.days{margin-left:auto;text-align:right;font-size:11px;color:var(--mut)}
.days b{display:block;font-size:20px;color:var(--ink)}
.days.hot b{color:#dc2626}
.line{font-size:13.5px;margin:6px 0 0;line-height:1.35}
.line .k{color:var(--mut);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;margin-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chip{font-size:11.5px;padding:3px 8px;border-radius:999px;background:#eef2f7;color:#334155;font-weight:bold}
.p-ALTA{background:var(--alta);color:var(--altaT)}.p-MEDIA{background:var(--media);color:var(--mediaT)}.p-BASSA{background:var(--bassa);color:var(--bassaT)}.p-MOL{background:var(--mol);color:var(--molT)}
.pc1{background:var(--urg);color:#fff}.pc2{background:#dc2626;color:#fff}.pc3{background:#f59e0b;color:#111}.pc4{background:#22c55e;color:#062}
.qa{display:flex;gap:6px;margin-top:9px;border-top:1px dashed var(--line);padding-top:8px}
.qa button{flex:1;font-size:12px;padding:7px 4px;border-radius:8px;border:1px solid var(--line);background:#f8fafc;cursor:pointer;color:var(--ink)}
.empty{color:#fff;text-align:center;padding:40px 10px;opacity:.85}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:58px;height:58px;border-radius:50%;font-size:30px;line-height:58px;padding:0;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 10px;font-size:18px;display:flex;align-items:center;gap:8px}
.sheet h2 .x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mut)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
label.f{min-width:0;display:flex;flex-direction:column;font-size:11.5px;color:var(--mut);gap:4px;text-transform:uppercase;letter-spacing:.3px}
label.f input,label.f select,label.f textarea{width:100%;min-width:0;font-size:15px;padding:9px 10px;border:1px solid #d1d5db;border-radius:9px;font-family:inherit;color:var(--ink);background:#fff;text-transform:none;letter-spacing:0}
label.f textarea{min-height:64px;resize:vertical}
.sugg{font-size:13px;padding:8px 10px;border-radius:9px;background:#f1f5f9}
.acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.acts .btn{flex:1}
.sec-t{font-size:13px;font-weight:bold;margin:14px 0 6px;color:var(--bg2);border-left:4px solid var(--acc);padding-left:8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pal button{border:2px solid transparent;border-radius:10px;padding:6px 8px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px;background:#f8fafc}
.pal button.on{border-color:var(--ink)}
.sw{display:inline-flex}.sw i{width:12px;height:18px;display:block}
.printarea{display:none}

.sheet .vbtn button{color:var(--ink);background:#eef2f7}.sheet .vbtn button.on{background:var(--acc);color:#111}
.ic{width:1.05em;height:1.05em;vertical-align:-.17em;flex:0 0 auto;stroke-width:1.9}
.btn .ic,.qa button .ic,.tab .ic,.vbtn .ic{margin-right:5px}
.vbtn button .ic{margin-right:0}.vbtn button span{margin-left:5px}
.qa button{display:inline-flex;align-items:center;justify-content:center;gap:5px}.qa button .ic{margin:0}
.chip .ic{width:.95em;height:.95em;margin-right:3px}
.sheet h2 .x .ic{width:22px;height:22px}
.srch{position:relative;flex:1 1 260px;display:flex}.srch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#8b93a5;pointer-events:none}
.filters .srch input[type=search]{flex:1;padding-left:34px!important}
body.glass .tab .ic{opacity:.85}body.glass .tab.on .ic{color:#67e8f9;opacity:1}
body.glass .qa button .ic{color:#67e8f9}
body.glass .btn:not(.ghost):not(.sec):not(.red) .ic{color:#fff}
.bS .ic{width:.95em;height:.95em;margin-right:2px}

/* caselle uniformi (fix iPhone: input data più larghi/alti della colonna) */
.fg{align-items:end}
label.f input,label.f select{height:44px;box-sizing:border-box;display:block}
label.f input[type=date]{-webkit-appearance:none;appearance:none;width:100%;min-width:0;max-width:100%;line-height:normal;text-align:left;padding-top:0;padding-bottom:0}
label.f input[type=date]::-webkit-date-and-time-value{text-align:left;margin:0}
label.f input[type=date]::-webkit-datetime-edit{padding:0}
label.f{white-space:nowrap}
label.f input,label.f select,label.f textarea{white-space:normal}

/* sfondo foto a piastrelle mandala (file sfondo_mandala.jpg nella stessa cartella) */
html:has(body.bgfoto){background:#0d0f1a!important}
body.bgfoto{background:transparent!important}
body.bgfoto::before{content:'';position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(8,10,18,.25),rgba(8,10,18,.45)),url('sfondo_mandala.jpg') top left/1350px auto repeat}
body.bgfoto.glass .card,body.bgfoto.glass .filters{background:rgba(18,20,30,.42)}
body.bgfoto.glass header{background:rgba(16,18,28,.55)}

/* ===== LOGO Tabellone Carrozzeria (SVG inline, colori dalle palette) ===== */
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tc-brand{display:block;line-height:0}
.tc-brand svg{display:block;height:auto;overflow:visible}
.tc-brand .tc-full{width:200px;max-width:100%}
.tc-brand .tc-icon{display:none;width:44px}
h1 small{margin-top:5px}
body.glass .tc-brand svg{filter:drop-shadow(0 0 10px rgba(var(--g1rgb),.25))}
@media(min-width:1100px){body.glass .tc-brand .tc-full{width:236px}}
@media(max-width:1099px){header .hrow{gap:8px}header h1{flex:1 1 auto;min-width:0}.tc-brand .tc-full{width:100%;max-width:300px}}
@media(max-width:700px){h1 small{font-size:10px}#bUser .ulab{display:none}#bUser .ic{margin-right:0}header .btn.ghost,header .vbtn button{padding:8px}}
@media(max-width:360px){.tc-brand .tc-full{display:none}.tc-brand .tc-icon{display:block}}
table.xl td.solY{background:#fff3b0}body.glass table.xl td.solY{background:rgba(250,204,21,.14)}
.ic.bell-y{width:min(19px,1.6em);height:min(19px,1.6em);color:#a16207;fill:#facc15;vertical-align:-4px}
body.glass .ic.bell-y{color:#facc15;fill:rgba(250,204,21,.35);filter:drop-shadow(0 0 5px rgba(250,204,21,.75))}
.srch .qx{display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:50%;background:rgba(127,127,127,.25);cursor:pointer}
.srch .qx::before,.srch .qx::after{content:'';position:absolute;left:7px;top:12px;width:12px;height:2px;background:currentColor;color:#9aa3b5;transform:rotate(45deg)}.srch .qx::after{transform:rotate(-45deg)}
.srch input:not(:placeholder-shown)+.qx{display:block}
.filters .srch input[type=search]::-webkit-search-cancel-button{display:none}

/* PC in vista Tabella: dashboard in alto a tutta larghezza, tabella sotto */
@media(min-width:1100px){
 body.vtab header{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"logo clock stats btn" "tabs tabs tabs tabs";column-gap:14px;row-gap:10px;align-items:stretch;padding:12px 16px}
 body.vtab header .hrow{display:contents}
 body.vtab header h1{grid-area:logo;display:flex;flex-direction:column;justify-content:center;margin:0}
 body.vtab .tc-brand .tc-full{width:210px}
 body.vtab header h1 small{white-space:nowrap;font-size:10.5px}
 body.vtab .clk{grid-area:clock;display:flex}
 body.vtab header .hbtns{grid-area:btn;display:grid!important;grid-template-columns:auto auto;gap:6px;align-content:center}
 body.vtab header .hbtns .vbtn{grid-column:1/-1;justify-content:stretch}
 body.vtab header .hbtns .vbtn button{flex:1}
 body.vtab .stats{grid-area:stats;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:0;overflow:visible;min-width:0}
 body.vtab .st{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:6px 8px}
 body.vtab .st b{font-size:26px;line-height:1.1}
 body.vtab .st span{font-size:11.5px}
 body.vtab .tabs,body.glass.vtab .tabs{grid-area:tabs;display:flex;margin:0;width:auto;max-width:none;min-width:0;overflow:hidden}
 body.vtab header .hbtns .vbtn button{display:flex;align-items:center;justify-content:center}
 body.vtab .st[data-k] b{-webkit-text-fill-color:currentColor;background:none}
 body.vtab .st[data-k=F] b{color:#fb7185}body.vtab .st[data-k=ALTA] b{color:#fb923c}body.vtab .st[data-k='30'] b{color:#f43f5e}body.vtab .st[data-k=SOL] b{color:#facc15}
 body.vtab .st{position:relative;overflow:hidden}
 body.vtab .st .ic{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;opacity:.14}
 body.vtab .tab{flex:1 1 0;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
 body.vtab main{max-width:none;margin:0;padding:12px 16px 0}
 body.vtab .filters{flex-wrap:nowrap;align-items:center;margin-bottom:10px}
 body.vtab .filters .srch{flex:2 1 220px}
 body.vtab .filters select{flex:1 1 150px}
}
/* orologio a palette (come DepoTrack Aurora) */
.clk{display:none;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);--surf:#1d2130;--txt:#fff}
body.glass .clk{background:rgba(255,255,255,.05);border-color:var(--gbd);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.clk #clkD{font-size:11px;color:rgba(255,255,255,.75);text-transform:capitalize;white-space:nowrap;letter-spacing:.2px}
.clk #clkT{display:flex;align-items:center;gap:3px;font-size:0;letter-spacing:0}
.clk #clkT .sep{display:flex;flex-direction:column;gap:6px;width:6px;align-items:center}
.clk #clkT .sep i{width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:.9}
body.glass .clk #clkT .sep i{background:var(--g1);box-shadow:0 0 6px var(--g1)}
.clk #clkT .fp{--h:36px;--w:25px;position:relative;display:block;width:var(--w);height:var(--h);perspective:120px;font:700 26px/36px 'Inter',Arial,sans-serif;color:var(--txt);text-align:center;font-variant-numeric:tabular-nums}
.clk #clkT .fp.s{--h:28px;--w:19px;font-size:20px;line-height:28px}
.clk #clkT .fp>span{position:absolute;left:0;right:0;height:50%;overflow:hidden;font:inherit;color:inherit;background:linear-gradient(180deg,#2a2f42,var(--surf));backface-visibility:hidden}
.clk #clkT .fp .t,.clk #clkT .fp .ft{top:0;border-radius:5px 5px 0 0;transform-origin:50% 100%}
.clk #clkT .fp .b,.clk #clkT .fp .fb{bottom:0;border-radius:0 0 5px 5px;transform-origin:50% 0;background:linear-gradient(180deg,#161925,#1b1f2c)}
.clk #clkT .fp>span>b{display:block;height:var(--h);font:inherit}
.clk #clkT .fp .b>b,.clk #clkT .fp .fb>b{margin-top:calc(var(--h) / -2)}
.clk #clkT .fp::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;margin-top:-.5px;background:rgba(0,0,0,.6);z-index:5}
.clk #clkT .fp .ft{z-index:3;transform:rotateX(0)}.clk #clkT .fp .fb{z-index:2;transform:rotateX(90deg)}
.clk #clkT .fp.go .ft{animation:fpTop .26s ease-in forwards}
.clk #clkT .fp.go .fb{animation:fpBot .26s .26s ease-out forwards}
@keyframes fpTop{to{transform:rotateX(-90deg)}}
@keyframes fpBot{to{transform:rotateX(0)}}
@media(min-width:1100px){body.glass.vcard .clk{display:flex;margin-top:4px}}
}

/* PC vista Tabella: niente scorrimento della pagina, scorre solo la tabella */
@media(min-width:1100px){
 html.fitpage,html.fitpage body{height:100%;overflow:hidden}
 html.fitpage main{padding-bottom:0}
}
/* barre di scorrimento sottili e in tema */
.xwrap{scrollbar-width:thin;scrollbar-color:rgba(127,140,170,.55) transparent}
.xwrap::-webkit-scrollbar{width:8px;height:8px}.xwrap::-webkit-scrollbar-track{background:transparent}
.xwrap::-webkit-scrollbar-thumb{background:rgba(127,140,170,.5);border-radius:8px}
body.glass .xwrap{scrollbar-color:rgba(var(--g1rgb),.55) transparent}
body.glass .xwrap::-webkit-scrollbar-thumb{background:linear-gradient(rgba(var(--g1rgb),.7),rgba(var(--g2rgb),.7))}
/* ================= STILE LIQUID GLASS ================= */
body.glass{--g1:#22d3ee;--g2:#a855f7;--g1rgb:34,211,238;--g2rgb:168,85,247;--gbase:#14161b;--gbg:rgba(255,255,255,.055);--gbd:rgba(160,210,255,.18);--gtx:#e8ecf4;--gmut:#9aa3b5;
 font-family:'Inter',system-ui,Arial,sans-serif;color:var(--gtx);background:var(--gbase);
 background-image:radial-gradient(600px 420px at 8% 12%,rgba(var(--g1rgb),.16),transparent 70%),radial-gradient(700px 500px at 92% 20%,rgba(var(--g2rgb),.16),transparent 70%),radial-gradient(600px 500px at 60% 100%,rgba(249,115,22,.10),transparent 70%),var(--pattern,none);
 background-size:auto,auto,auto,120px 120px;background-attachment:fixed}
body.glass .gl,body.glass header,body.glass .filters,body.glass .card,body.glass .sheet,body.glass .xwrap,body.glass .toast,body.glass .ro{
 background:var(--gbg);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
 border:1px solid var(--gbd);box-shadow:0 0 0 1px rgba(var(--g2rgb),.08),0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07)}
body.glass header{background:rgba(22,25,32,.72);border-width:0 0 1px 0;border-bottom:1px solid var(--gbd);box-shadow:0 8px 30px rgba(0,0,0,.4)}
body.glass header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--g1),var(--g2));opacity:.8}
body.glass h1{font-weight:700;letter-spacing:.2px}
body.glass .st{background:rgba(255,255,255,.05);border:1px solid var(--gbd);border-radius:14px}
body.glass .st b{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent}
body.glass .st.on{background:linear-gradient(135deg,rgba(var(--g1rgb),.25),rgba(var(--g2rgb),.25));box-shadow:0 0 18px rgba(var(--g1rgb),.25);color:#fff}
body.glass .st.on b{color:#fff;-webkit-text-fill-color:#fff}
body.glass .tabs{background:rgba(255,255,255,.04);border:1px solid var(--gbd);border-radius:14px;padding:4px;width:max-content;max-width:100%}
body.glass .tab{background:transparent;border:1px solid transparent;color:var(--gmut);border-radius:10px}
body.glass .tab.on{background:rgba(var(--g1rgb),.10);color:#fff;border:1px solid rgba(var(--g1rgb),.55);box-shadow:0 0 14px rgba(var(--g1rgb),.25),inset 0 0 10px rgba(var(--g2rgb),.15);font-weight:600}
body.glass .btn{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff;box-shadow:0 0 18px rgba(var(--g1rgb),.35),0 0 26px rgba(var(--g2rgb),.25);border:1px solid rgba(255,255,255,.25)}
body.glass .btn.ghost,body.glass .btn.sec{background:rgba(255,255,255,.07);color:var(--gtx);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);border:1px solid var(--gbd)}
body.glass .btn.red{background:rgba(239,68,68,.18);color:#fecaca;border:1px solid rgba(239,68,68,.5);box-shadow:0 0 14px rgba(239,68,68,.2)}
body.glass .btn.green{background:linear-gradient(90deg,var(--g1),var(--g2));color:#fff}
body.glass .fab{border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),rgba(255,255,255,.04) 60%),rgba(30,34,44,.7);border:1px solid rgba(var(--g1rgb),.6);color:var(--g1);box-shadow:0 0 22px rgba(var(--g1rgb),.45),0 0 40px rgba(var(--g2rgb),.25);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.glass .vbtn{border:1px solid var(--gbd);background:rgba(255,255,255,.04);border-radius:12px;padding:3px;gap:2px}

 });

function toISO(x){
 if(!x)return'';
 if(x instanceof Date)return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
 const m=String(x).match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
 if(m)return (m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
 return /^\d{4}-\d{2}-\d{2}/.test(x)?String(x).slice(0,10):'';
}

let FLAP=null;
function flapBuild(c){let h='';for(let i=0;i<6;i++){if(i===2||i===4)h+='<span class="sep" aria-hidden="true"><i></i><i></i></span>';h+='<span class="fp'+(i>3?' s':'')+'" aria-hidden="true"><span class="t"><b></b></span><span class="b"><b></b></span><span class="ft"><b></b></span><span class="fb"><b></b></span></span>'}
 c.innerHTML=h;FLAP=[...c.querySelectorAll('.fp')].map(el=>({el,v:null}))}
function flapSet(f,nv){
 if(f.v===nv)return;const ov=f.v===null?nv:f.v,q=x=>f.el.querySelector(x+'>b');
 const red=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 f.v=nv;f.el.classList.remove('go');q('.t').textContent=nv;q('.ft').textContent=ov;q('.fb').textContent=nv;q('.b').textContent=ov;
 if(red||ov===nv){q('.b').textContent=nv;q('.ft').textContent=nv;return}
 void f.el.offsetWidth;f.el.classList.add('go');
 clearTimeout(f.tm);f.tm=setTimeout(()=>{q('.b').textContent=nv;q('.ft').textContent=nv;f.el.classList.remove('go')},560);
}
function tickClock(){const d=new Date(),p=n=>('0'+n).slice(-2),c=document.getElementById('clkT');if(!c)return;
 const t=p(d.getHours())+p(d.getMinutes())+p(d.getSeconds());
 if(!FLAP||!c.querySelector('.fp'))flapBuild(c);c.setAttribute('aria-label','Ora '+t.slice(0,2)+':'+t.slice(2,4));
 for(let i=0;i<6;i++)flapSet(FLAP[i],t.charAt(i));
 document.getElementById('clkD').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

if(typeof firebase==='undefined'){setStatus('err');toast('Firebase non raggiungibile: mostro l\'ultima copia salvata');LOADED=!!S.rows.length;render()}
else{
 try{firebase.initializeApp(CFG);DB=firebase.database()}catch(e){setStatus('err')}
 try{AUTH=firebase.auth();AUTH.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});AUTH.onAuthStateChanged(onAuth)}catch(e){AUTH=null}
 if(DB){
  setStatus('conn');
  attachDB();
  DB.ref('.info/connected').on('value',s=>{if(LOADED)setStatus(s.val()?'live':'off')});
 }
}
